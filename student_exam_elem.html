<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（高学年・RPG）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #333; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; min-height: 100vh; background: #e8f5e9; position: relative; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); padding-bottom: 100px; }
        
        .jr-header { background: #2e7d32; color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 0 #1b5e20; }
        .jr-status { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 10px 15px; border-radius: 8px; border: 2px solid #2e7d32; margin-bottom: 20px; font-weight: bold; }
        .jr-exp-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .jr-exp-fill { height: 100%; background: #ffb300; width: 60%; transition: width 0.5s; }
        
        .jr-quest-card { background: #fff; border: 2px solid #81c784; border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; transition: 0.3s; }
        .jr-quest-card.completed { opacity: 0.7; filter: grayscale(50%); border-color: #9e9e9e; }
        .btn-jr-attack { background: #1976d2; color: #fff; border: none; padding: 10px; font-weight: bold; border-radius: 4px; width: 100%; margin-top: 10px; cursor: pointer; box-shadow: 0 3px 0 #0d47a1; transition: 0.2s;}
        .btn-jr-attack:active { transform: translateY(3px); box-shadow: none; }
        .btn-jr-attack.done { background: #757575; box-shadow: 0 3px 0 #424242; cursor: default; }

        /* --- 導きの妖精（AIチャット） --- */
        .chat-fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #8bc34a; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 4px 15px rgba(139,195,74,0.4); cursor: pointer; z-index: 9999; border: 2px solid #fff; }
        .chat-window { position: fixed; bottom: 100px; right: 20px; width: calc(100% - 40px); max-width: 360px; height: 380px; background: #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; z-index: 9998; border: 3px solid #8bc34a; }
        .chat-header { background: #558b2f; color: #fff; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f1f8e9; display: flex; flex-direction: column; gap: 10px; font-family: serif; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #c5e1a5; background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .chat-input-area button { background: #8bc34a; color: #fff; border: none; width: 40px; height: 40px; border-radius: 4px; margin-left: 10px; font-weight: bold; }
        .msg-bubble { max-width: 80%; padding: 10px 15px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
        .msg-ai { background: #fff; border: 1px solid #8bc34a; color: #33691e; align-self: flex-start; }
        .msg-student { background: #8bc34a; color: #fff; align-self: flex-end; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="jr-header"><h1 style="font-size: 20px; margin: 0;">📜 今日のクエストボード</h1></div>
        
        <div class="jr-status">
            <div>勇者レベル: <span id="hero-level">12</span></div>
            <div style="width: 50%;">
                <div style="font-size: 10px; text-align: right;">EXP</div>
                <div class="jr-exp-bar"><div class="jr-exp-fill" id="exp-bar"></div></div>
            </div>
        </div>

        <div id="dynamic-jr-task"></div>

        <div class="jr-quest-card" id="static-task">
            <div style="font-weight: bold; color: #2e7d32; margin-bottom: 5px;">メインクエスト</div>
            <div style="font-size: 16px; margin-bottom: 10px;">算数ドリル 割合の計算をたおす</div>
            <button class="btn-jr-attack" onclick="markDone('static-task', this)">⚔️ クエストクリア！</button>
        </div>

        <div class="chat-fab" onclick="toggleChat()">🧚</div>
        <div class="chat-window" id="chat-window">
            <div class="chat-header"><span>🧚 導きの妖精ナビ</span><span style="cursor: pointer; font-size: 20px;" onclick="toggleChat()">×</span></div>
            <div class="chat-body" id="chat-body">
                <div class="msg-bubble msg-ai">冒険で行き詰まったか？魔法のヒントなら私に任せておけ！（先生にも共有しているぞ）</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="妖精にたずねる...">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                document.getElementById('dynamic-jr-task').innerHTML = `
                    <div class="jr-quest-card" id="dynamic-task" style="border-color: #ff9800; background: #fffde7;">
                        <div style="font-weight: bold; color: #ff9800; margin-bottom: 5px;">⚠️ 緊急クエスト発生！</div>
                        <div style="font-size: 16px; margin-bottom: 10px;">${task.content}</div>
                        <button class="btn-jr-attack" style="background: #ff9800; box-shadow: 0 3px 0 #f57c00;" onclick="markDynamicDone(this)">⚔️ クエストに挑む！</button>
                    </div>`;
            }
        };

        function markDynamicDone(btn) {
            btn.innerText = "討伐完了！"; btn.classList.add("done");
            document.getElementById('dynamic-task').classList.add("completed");
            document.getElementById('exp-bar').style.width = "100%";
            localStorage.setItem('criety_task_status', 'completed');
        }

        function markDone(taskId, btn) {
            btn.innerText = "討伐完了！"; btn.classList.add("done");
            document.getElementById(taskId).classList.add("completed");
        }

        function toggleChat() {
            const chat = document.getElementById('chat-window');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            const chatBody = document.getElementById('chat-body');
            
            chatBody.innerHTML += `<div class="msg-bubble msg-student">${text}</div>`;
            input.value = ''; chatBody.scrollTop = chatBody.scrollHeight;

            let chatLog = JSON.parse(localStorage.getItem('criety_chat_log')) || [];
            chatLog.push({ sender: 'student', text: text, time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem('criety_chat_log', JSON.stringify(chatLog));

            setTimeout(() => {
                const aiReply = "ふむ、そこが難関だな。公式という名の武器をもう一度確認してみるのじゃ！";
                chatBody.innerHTML += `<div class="msg-bubble msg-ai">${aiReply}</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
                chatLog.push({ sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) });
                localStorage.setItem('criety_chat_log', JSON.stringify(chatLog));
            }, 1000);
        }
    </script>
</body>
</html>
