<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Criety - 生徒ダッシュボード（小学生）</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root { --bg: #fffcf5; --main: #ff9800; --accent: #29b6f6; --success: #4caf50; --danger: #f44336; --card-bg: #ffffff; --text-main: #4a4a4a; --text-light: #888888; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif; background-color: var(--bg); color: var(--text-main); min-height: 100vh; }
        
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #ffb74d 0%, #ff9800 100%); z-index: 99999; display: flex; justify-content: center; align-items: center; padding: 20px;}
        .auth-box { background: #fff; padding: 40px; border-radius: 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 15px 35px rgba(230,138,0,0.3); }
        .auth-box h2 { color: var(--main); margin-bottom: 25px; font-size: 24px; font-weight: 800; }
        .auth-box input { width: 100%; padding: 16px; margin-bottom: 15px; border: 2px solid #ffe0b2; border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; background: #fff9f0;}
        .auth-box input:focus { border-color: var(--main); background: #fff; }
        .btn-auth { width: 100%; padding: 16px; background: var(--main); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #e68a00;}
        .btn-auth:active { transform: translateY(4px); box-shadow: none; }

        .header-bar { background: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--main);}
        .header-logo { color: var(--main); font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; }

        .app-container { display: grid; grid-template-columns: 320px 1fr 340px; gap: 25px; max-width: 1400px; margin: 0 auto; padding: 25px; align-items: start; }
        @media (max-width: 1024px) { .app-container { grid-template-columns: 1fr; padding: 15px; gap: 20px;} }

        .dashboard-col { display: flex; flex-direction: column; gap: 25px; }
        .mid-card { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 2px solid #fff3e0; position: relative;}
        .mid-card h3 { font-size: 16px; color: var(--main); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 2px dashed #ffe0b2; padding-bottom: 10px; font-weight: 800; }
        .mid-card h3 i { color: var(--main); font-size: 18px;}
        
        .mid-countdown { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #fff; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 10px; box-shadow: 0 6px 15px rgba(255,154,158,0.4); }
        .mid-countdown h2 { font-size: 18px; margin: 0; font-weight: bold;}

        /* メッセージ表示エリア */
        #quick-message-area { display: none; grid-column: 1 / -1; background: #fffcf5; border: 3px dashed #ffb74d; border-radius: 16px; padding: 15px 20px; margin-bottom: 5px; box-shadow: 0 4px 12px rgba(255,152,0,0.1); align-items: center; gap: 15px; }

        .timer-display { font-size: 52px; font-weight: 900; color: var(--main); text-align: center; margin: 15px 0; background: #fffdf5; padding: 15px; border-radius: 20px; border: 3px dashed #ffb74d; font-family: monospace; letter-spacing: 2px;}
        .timer-setup-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .timer-btn-group { display: flex; gap: 10px; }
        .timer-btn { flex: 1; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 4px 0 rgba(0,0,0,0.1);}
        .timer-btn:active { transform: translateY(4px); box-shadow: none; }
        .time-add-btn { flex: 1; padding: 12px 0; border: 2px solid #ffe0b2; border-radius: 10px; font-size: 13px; cursor: pointer; background:#fff9f0; color:#e65100; font-weight: bold; transition: 0.2s;}
        .time-add-btn:active { background: #ffe0b2; }
        
        .form-row { margin-bottom: 15px; }
        .form-row label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 6px; color: var(--text-light); }
        .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 14px; outline: none; background: #fafafa; transition: 0.2s;}
        .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--main); background: #fff; }
        .form-col-3 { display: flex; gap: 8px; } .form-col-3 > div { flex: 1; }

        .mini-calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; text-align: center; }
        .cal-day-head { font-weight: bold; padding-bottom: 8px; color: var(--text-light); }
        .cal-day { border: 2px solid #f5f5f5; border-radius: 10px; min-height: 50px; padding: 4px; cursor: pointer; background: #fff; transition: 0.2s;}
        .cal-day:active { transform: scale(0.95); }
        .cal-day.today { background: #fff9c4; color: #e65100; font-weight: bold; border-color: #ffb74d;}
        .cal-day.selected { border: 3px solid var(--accent); background: #e1f5fe; }
        .cal-badge { font-size: 10px; border-radius: 6px; color: white; margin-top: 4px; padding: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; text-align: left; }

        .event-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 13px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .event-btn:active { transform: translateY(4px); box-shadow: none;}
        .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .stamp-slot { aspect-ratio: 1; border: 3px dashed #ffe0b2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #fffdf5;}
        .stamp-slot.filled { background: #fff; border: 3px solid #ffb74d; color: #ff9800; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .hw-list { max-height: 300px; overflow-y: auto; padding-right: 5px;}
        .hw-item { background: #fafafa; border: 2px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .hw-item.done-bg { background: #f1f8e9; border-color: #c5e1a5; }
        .btn-complete { padding: 12px; background: var(--success); color: #fff; border: none; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 14px; transition: 0.2s; box-shadow: 0 4px 0 #388e3c;}
        .btn-complete:active { transform: translateY(4px); box-shadow: none;}

        .tool-btn { padding: 10px 15px; cursor: pointer; border: 2px solid #eee; border-radius: 10px; background: #fff; font-size: 13px; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 6px; transition: 0.2s;}
        .tool-btn:active { transform: scale(0.95); }
        .tool-btn.active { background: #fff3e0; border-color: #ffb74d; color: #e65100; }
        .slide-item { background: #fff; padding: 10px; border-radius: 12px; border: 2px solid #eee; margin-bottom: 12px; text-align: center; position: relative;}
        .slide-item img { width: 100%; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; }
        .slide-delete-btn { position: absolute; top: 15px; right: 15px; background: var(--danger); color: white; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #c62828;}
        .slide-delete-btn:active { transform: translateY(3px); box-shadow: none;}
        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 100000; flex-direction: column; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ffe0b2; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffb74d; }
        @keyframes pop { 0% { transform: scale(0.5) rotate(-10deg); } 100% { transform: scale(1) rotate(0deg); } }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2><i class="fa-solid fa-graduation-cap"></i> Criety ログイン</h2>
            <input type="text" id="student-email" placeholder="生徒ID">
            <input type="password" id="student-password" placeholder="パスワード">
            <button class="btn-auth" onclick="studentLogin()">はじめる！</button>
        </div>
    </div>

    <div class="header-bar">
        <div class="header-logo"><i class="fa-solid fa-rocket"></i> Criety Kids</div>
        <div id="user-display" style="font-size: 14px; font-weight: bold; color: var(--text-light);"></div>
        <button onclick="studentLogout()" style="background: none; border: none; color: var(--text-light); font-size: 14px; cursor: pointer; font-weight: bold;"><i class="fa-solid fa-right-from-bracket"></i> おわる</button>
    </div>

    <div id="preview-overlay">
        <div style="background:#fff; padding:10px; text-align:right;"><button onclick="closeFile()" style="background:var(--danger); color:white; border:none; padding:10px 20px; border-radius:8px; font-weight:bold;">とじる ✖</button></div>
        <div id="file-content" style="flex:1; overflow:auto; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <div class="app-container">
        
        <div id="quick-message-area">
            <div style="font-size: 30px; color: #ff9800;"><i class="fa-solid fa-comment-dots"></i></div>
            <div>
                <div style="font-size: 12px; font-weight: bold; color: #ff9800; margin-bottom: 4px;">先生からのメッセージ</div>
                <div id="quick-message-text" style="font-size: 16px; font-weight: bold; color: var(--text-main);"></div>
            </div>
        </div>

        <div class="dashboard-col col-left">
            <div class="mid-countdown" id="countdown-area" style="display: none;">
                <h2 id="countdown-title"></h2>
            </div>

            <div class="mid-card">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px;">
                    <h3 style="border:none; margin:0;"><i class="fa-solid fa-star"></i> ごほうびスタンプ</h3>
                    <span id="stamp-card-level" style="font-size: 12px; font-weight: bold; color: #e91e63; background: #fce4ec; padding: 4px 12px; border-radius: 12px;">1枚目</span>
                </div>
                <div class="stamp-grid" id="stamp-grid"></div>
            </div>

            <div class="mid-card">
                <h3><i class="fa-regular fa-calendar-check"></i> よてい表</h3>
                <div class="mini-calendar" id="mini-calendar"></div>
                <div id="event-add-panel" style="display: none; background:#fffdf5; padding:15px; border-radius:12px; margin-top:15px; border:2px dashed #ffe0b2;">
                    <div style="font-size:14px; font-weight:bold; color:var(--text-main); border-bottom:2px solid #ffe0b2; padding-bottom:8px; margin-bottom:12px;"><i class="fa-regular fa-clock"></i> <span id="selected-date-display"></span></div>
                    <div id="selected-date-events-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom:15px;"></div>
                    <div style="display: flex; gap: 8px;">
                        <button class="event-btn" style="background:var(--accent);" onclick="addStudentEvent('📝 べんきょう', 'var(--accent)')">べんきょう</button>
                        <button class="event-btn" style="background:var(--success);" onclick="addStudentEvent('🟢 あそび', 'var(--success)')">あそび</button>
                    </div>
                </div>
            </div>

            <div class="mid-card">
                <h3><i class="fa-solid fa-list-check"></i> しゅくだいリスト</h3>
                <div class="hw-list" id="hw-list"></div>
            </div>
        </div>

        <div class="dashboard-col col-center">
            <div class="mid-card">
                <h3><i class="fa-solid fa-stopwatch"></i> べんきょうタイマー</h3>
                <div class="timer-display" id="timer-display">00:00.00</div>
                <div class="timer-setup-row" id="timer-setup">
                    <button class="time-add-btn" onclick="addTime(600)">+ 10分</button>
                    <button class="time-add-btn" onclick="addTime(300)">+ 5分</button>
                    <button class="time-add-btn" onclick="addTime(60)">+ 1分</button>
                    <button class="time-add-btn" onclick="addTime(10)">+ 10秒</button>
                </div>
                <div class="timer-btn-group">
                    <button class="timer-btn" style="background:var(--success);" onclick="startTimer()"><i class="fa-solid fa-play"></i> スタート</button>
                    <button class="timer-btn" style="background:var(--danger);" onclick="stopTimer()"><i class="fa-solid fa-pause"></i> ストップ</button>
                    <button class="timer-btn" style="background:#a0aec0;" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i> リセット</button>
                </div>
            </div>

            <div class="mid-card">
                <h3><i class="fa-solid fa-pen-nib"></i> じぶんのノート（先生に提出）</h3>
                <p style="font-size:11px; color:var(--text-light); margin-bottom:10px;">写真を読み込んだ後は、2本指で「ズーム（拡大）」や「移動」ができます！</p>
                <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; background: #fafafa; padding: 12px; border-radius: 12px; border: 2px solid #eee;" id="student-drawing-tools">
                    <button class="tool-btn" style="color: #fff; background: var(--accent); border-color: var(--accent);" onclick="document.getElementById('camera-input').click()"><i class="fa-solid fa-camera"></i> ワークを撮る</button>
                    <input type="file" accept="image/*" id="camera-input" style="display:none;" onchange="loadCameraImage(event)">

                    <button class="tool-btn active" id="btn-pen" onclick="setTool('pen')"><i class="fa-solid fa-pen"></i> ペン</button>
                    <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')"><i class="fa-solid fa-eraser"></i> 消しゴム</button>
                    <button class="tool-btn" style="color: var(--text-main);" onclick="resetZoom()"><i class="fa-solid fa-magnifying-glass-minus"></i> もとにもどす</button>

                    <input type="color" id="color-picker" value="#ff9800" onchange="setColor(this.value)" style="width: 36px; height: 36px; border: none; padding: 0; cursor: pointer; border-radius:6px; margin-left: auto;">
                </div>
                <div id="text-controls" style="display: none; justify-content: center; gap: 8px; margin-bottom: 15px;">
                    <button class="tool-btn" onclick="changeTextScale(0.2)">大きく</button>
                    <button class="tool-btn" onclick="changeTextScale(-0.2)">小さく</button>
                    <button class="tool-btn" style="background:var(--success); color:white; border:none;" onclick="fixText()">決定</button>
                </div>
                <canvas id="student-whiteboard" width="800" height="600" style="width: 100%; border: 2px solid #eee; border-radius: 12px; background: white; touch-action: none; display: block; margin-bottom: 15px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);"></canvas>
                <div style="display: flex; gap: 10px;">
                    <button onclick="submitSlide()" style="flex: 2; padding: 16px; background: var(--main); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size:16px; box-shadow: 0 4px 0 #e68a00;"><i class="fa-regular fa-paper-plane"></i> 先生に送る！</button>
                    <button onclick="clearBoard()" style="flex: 1; padding: 16px; background: #fff; color: var(--danger); border: 2px solid #ffcdd2; border-radius: 12px; font-weight: bold; cursor: pointer; font-size:14px;"><i class="fa-solid fa-trash-can"></i> ぜんぶ消す</button>
                </div>
            </div>
            
            <div class="mid-card" id="shared-board-card" style="display: none;">
                <h3><i class="fa-solid fa-chalkboard-user"></i> 先生からのノート</h3>
                <div id="teacher-slides-container" style="display:flex; flex-direction: column; gap:10px; max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>

        <div class="dashboard-col col-right">
            <div class="mid-card">
                <h3><i class="fa-solid fa-triangle-exclamation"></i> まちがい・質問の報告</h3>
                <div class="form-row"><label>教材の名前</label><input type="text" id="report-mat" placeholder="例: 算数ドリル"></div>
                <div class="form-row form-col-3">
                    <div><label>ページ</label><input type="text" id="report-p" placeholder="P. 24"></div>
                    <div><label>大問</label><input type="text" id="report-q1" placeholder="3"></div>
                    <div><label>小問</label><input type="text" id="report-q2" placeholder="(1)"></div>
                </div>
                <div class="form-row"><label>かかった時間 (分)</label><input type="number" id="report-time" placeholder="15"></div>
                <div class="form-row">
                    <label>ミスのしゅるい</label>
                    <select id="report-reason">
                        <option value="" disabled selected>えらんでね</option>
                        <option value="ケアレスミス">ケアレスミス（うっかり）</option>
                        <option value="全くわからない">全くわからない（教えてほしい）</option>
                        <option value="覚えていなかった">覚えていなかった</option>
                        <option value="原因不明">自分でもわからない</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>かいけつした？</label>
                    <select id="report-solved">
                        <option value="" disabled selected>えらんでね</option>
                        <option value="解決済">はい（かいけつした！）</option>
                        <option value="未解決">いいえ（まだわからない）</option>
                    </select>
                </div>
                <div class="form-row"><label>先生につたえたいこと (自由)</label><textarea id="report-memo" rows="2" placeholder="むずかしかった所や、がんばった所をかいてね！"></textarea></div>
                <button onclick="submitMistakeReport()" style="width:100%; padding:14px; background:#e91e63; color:white; border:none; border-radius:10px; font-weight:bold; font-size:16px; margin-top:8px; cursor:pointer; box-shadow: 0 4px 0 #c2185b;"><i class="fa-solid fa-paper-plane"></i> 先生に報告する</button>
            </div>

            <div class="mid-card">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> 送ったノートの履歴</h3>
                <div id="my-sent-slides-container" style="display:flex; flex-direction: column; gap:10px; max-height: 250px; overflow-y: auto;"></div>
            </div>

            <div class="mid-card">
                <h3><i class="fa-solid fa-file-pdf"></i> 先生からのプリント</h3>
                <div id="material-list" style="display:flex; flex-direction: column; gap:8px;"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDF_AIVWGLu6OI1HVflHRVwCta6dcPu0Bw",
            authDomain: "criety-app-f76d4.firebaseapp.com",
            databaseURL: "https://criety-app-f76d4-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "criety-app-f76d4",
            storageBucket: "criety-app-f76d4.firebasestorage.app",
            messagingSenderId: "826655717900",
            appId: "1:826655717900:web:d724b66a1deec6505e4c29"
        };
        
        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } 
        catch(e) { console.error("Firebase Error:", e); }

        let myStudentId = ""; let studentDataCache = {}; const STAMP_MAX = 10; let selectedDateStr = "";
        let timerInterval = null; let timerRunning = false; let timerStartTime = 0; let timerSavedTime = 0; let timerTargetSeconds = 0; let audioCtx = null;

        function loadFB(key, defaultVal) { const data = studentDataCache[key]; if(data === undefined || data === null) return defaultVal; try { const parsed = typeof data === 'string' ? JSON.parse(data) : data; return parsed !== null ? parsed : defaultVal; } catch(e) { return defaultVal; } }
        function saveFB(key, data) { studentDataCache[key] = typeof data === 'string' ? data : JSON.parse(JSON.stringify(data)); if(db) db.ref('students/' + myStudentId + '/' + key).set(JSON.stringify(data)); }
        function saveFB_Raw(key, val) { studentDataCache[key] = val; if(db) db.ref('students/' + myStudentId + '/' + key).set(val); }

        document.addEventListener("DOMContentLoaded", () => {
            const isLoggedIn = localStorage.getItem('student_elementary_logged_in');
            const savedId = localStorage.getItem('my_elementary_student_id');
            if(isLoggedIn === 'true' && savedId) {
                myStudentId = savedId;
                document.getElementById('auth-overlay').style.display = 'none';
                startApp();
            }
        });

        function studentLogin() {
            const id = document.getElementById('student-email').value.trim().toLowerCase();
            const pass = document.getElementById('student-password').value.trim();
            if(!id || !pass) return alert("IDとパスワードを入力してね。");
            
            db.ref('admin/students/' + id).once('value').then(snapshot => {
                const data = snapshot.val();
                if (data && data.password === pass) {
                    myStudentId = id; localStorage.setItem('student_elementary_logged_in', 'true'); localStorage.setItem('my_elementary_student_id', id);
                    document.getElementById('auth-overlay').style.display = 'none'; startApp();
                } else { alert("IDかパスワードがちがうよ！"); }
            }).catch(e => alert("通信エラーがおきました。"));
        }
        function studentLogout() { localStorage.clear(); location.reload(); }

        function startApp() {
            document.getElementById('user-display').innerText = "ID: " + myStudentId;
            renderStamps(); renderCalendar(); renderHomeworkList(); renderMySentSlides(); syncData();
            if(!db) return;
            db.ref('students/' + myStudentId).on('value', (snapshot) => {
                studentDataCache = snapshot.val() || {};
                renderStamps(); renderCalendar(); renderHomeworkList(); renderMySentSlides(); syncData(); 
            });
        }

        function initAudio() { if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if(audioCtx.state === 'suspended') { audioCtx.resume(); } }
        function playAlarm() { if(!audioCtx) return; try { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.value = 880; gain.gain.setValueAtTime(0.3, audioCtx.currentTime); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5); } catch(e) {} }
        function updateTimerDisplay(elapsedMs) { let displayMs = elapsedMs; if(timerTargetSeconds > 0) { displayMs = (timerTargetSeconds * 1000) - elapsedMs; if(displayMs <= 0) { displayMs = 0; stopTimer(); playAlarm(); setTimeout(() => alert("⏰ じかんになったよ！"), 100); } } let totalSec = Math.floor(displayMs / 1000); let centi = String(Math.floor((displayMs % 1000) / 10)).padStart(2, '0'); let m = String(Math.floor(totalSec / 60)).padStart(2, '0'); let s = String(totalSec % 60).padStart(2, '0'); document.getElementById('timer-display').innerText = `${m}:${s}.${centi}`; }
        function addTime(sec) { if(timerRunning) return; timerTargetSeconds += sec; updateTimerDisplay(0); }
        function startTimer() { initAudio(); if(timerRunning) return; timerRunning = true; timerStartTime = Date.now(); document.getElementById('timer-setup').style.opacity = "0.3"; document.getElementById('timer-setup').style.pointerEvents = "none"; timerInterval = setInterval(() => { updateTimerDisplay(Date.now() - timerStartTime + timerSavedTime); }, 10); }
        function stopTimer() { if(!timerRunning) return; timerRunning = false; timerSavedTime += Date.now() - timerStartTime; clearInterval(timerInterval); document.getElementById('timer-setup').style.opacity = "1"; document.getElementById('timer-setup').style.pointerEvents = "auto"; }
        function resetTimer() { if(confirm("タイマーをリセットする？")) { stopTimer(); timerSavedTime = 0; timerTargetSeconds = 0; updateTimerDisplay(0); } }

        function submitMistakeReport() {
            const mat = document.getElementById('report-mat').value.trim(); if(!mat) return alert("教材の名前を入れてね！");
            const report = { id: Date.now(), date: new Date().toLocaleString(), mat: mat, p: document.getElementById('report-p').value, q1: document.getElementById('report-q1').value, q2: document.getElementById('report-q2').value, time: document.getElementById('report-time').value, reason: document.getElementById('report-reason').value, solved: document.getElementById('report-solved').value, memo: document.getElementById('report-memo').value };
            let reports = loadFB('mistake_reports', []); reports.push(report); saveFB('mistake_reports', reports); 
            document.querySelectorAll('input[type="text"], input[type="number"], textarea').forEach(e=>e.value=""); document.querySelectorAll('select').forEach(e=>e.selectedIndex=0); alert("先生に報告を送ったよ！");
        }

        function renderStamps() {
            const count = parseInt(studentDataCache['stamps']) || 0; const cards = parseInt(studentDataCache['stamp_cards']) || 1;
            document.getElementById('stamp-card-level').innerText = `${cards}枚目`; const grid = document.getElementById('stamp-grid'); grid.innerHTML = "";
            for(let i=1; i<=STAMP_MAX; i++) grid.innerHTML += `<div class="stamp-slot ${i <= count ? "filled" : ""}">${i <= count ? '💮' : ""}</div>`;
        }

        function renderCalendar() {
            const grid = document.getElementById('mini-calendar'); grid.innerHTML = "";
            const today = new Date(); const year = today.getFullYear(), month = today.getMonth(); const daysInMonth = new Date(year, month + 1, 0).getDate();
            const events = loadFB('cal_events', {}); const doneDict = loadFB('hw_done', {});
            const targetTitle = loadFB('target_title', ""); const targetDate = loadFB('target_date', "");

            ['日','月','火','水','木','金','土'].forEach(h => grid.innerHTML += `<div class="cal-day-head">${h}</div>`);
            for(let i=0; i<new Date(year, month, 1).getDay(); i++) grid.innerHTML += `<div></div>`;
            for(let i=1; i<=daysInMonth; i++) {
                const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`; let badgeHtml = "";
                if(targetTitle && targetDate === dStr) { badgeHtml += `<div class="cal-badge" style="background:#fce4ec; color:#e91e63; border-left:2px solid #e91e63;">🌸 目標: ${targetTitle}</div>`; }
                if(events[dStr]) events[dStr].forEach(ev => {
                    let color = ev.color || '#a0aec0'; let text = ev.text;
                    if(ev.type === 'hw') { color = doneDict[`${dStr}_${ev.text}`] ? '#4caf50' : '#ff9800'; text = doneDict[`${dStr}_${ev.text}`] ? `済:${ev.text}` : `宿:${ev.text}`; }
                    else if (ev.type === 'lesson') { color = '#29b6f6'; text = `👨‍🏫 先生の日`; } else if (ev.type === 'test') { color = '#f44336'; text = `📝 ${ev.text}`; }
                    badgeHtml += `<div class="cal-badge" style="background:${color}">${text}</div>`;
                });
                grid.innerHTML += `<div class="cal-day ${i === today.getDate() ? 'today' : ''} ${dStr === selectedDateStr ? 'selected' : ''}" onclick="selectDate('${dStr}')"><b style="display:block;margin-bottom:2px;">${i}</b>${badgeHtml}</div>`;
            }
            if(selectedDateStr) renderSelectedDateEvents();
        }

        function selectDate(dStr) { selectedDateStr = dStr; document.getElementById('event-add-panel').style.display = 'block'; document.getElementById('selected-date-display').innerText = dStr; renderCalendar(); }
        function renderSelectedDateEvents() {
            const listDiv = document.getElementById('selected-date-events-list'); const events = loadFB('cal_events', {}); const evs = events[selectedDateStr] || []; const doneDict = loadFB('hw_done', {});
            const targetTitle = loadFB('target_title', ""); const targetDate = loadFB('target_date', "");
            let html = "";
            if(targetTitle && targetDate === selectedDateStr) { html += `<div style="display:flex; justify-content:space-between; align-items:center; background:#fce4ec; border-left:4px solid #e91e63; padding:8px 10px; border-radius:6px; border: 1px solid #f8bbd0; margin-bottom:5px;"><span style="font-size:13px; font-weight:bold; color:#c2185b;">🌸 目標: ${targetTitle}</span></div>`; }
            if(evs.length === 0 && html === "") { listDiv.innerHTML = `<div style="font-size:12px; color:#a0aec0; text-align:center; padding:10px 0;">よていはありません</div>`; return; }
            
            html += evs.map((ev, idx) => {
                let color = ev.color || '#a0aec0'; let text = ev.text; let delBtn = "";
                if(ev.type === 'hw') { color = doneDict[`${selectedDateStr}_${ev.text}`] ? '#4caf50' : '#ff9800'; }
                else if (ev.type === 'lesson') { color = '#29b6f6'; text = `👨‍🏫 先生の日`; } else if (ev.type === 'test') { color = '#f44336'; text = `📝 ${ev.text}`; }
                if(ev.type === 'student') delBtn = `<button onclick="deleteEvent('${selectedDateStr}', ${idx})" style="background:var(--danger); color:white; border:none; border-radius:4px; padding:5px 10px; font-size:10px; font-weight:bold; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>`;
                return `<div style="display:flex; justify-content:space-between; align-items:center; background:#fff; border-left:4px solid ${color}; padding:8px 10px; border-radius:6px; border: 1px solid #eee;"><span style="font-size:13px; font-weight:bold;">${text}</span>${delBtn}</div>`;
            }).join('');
            listDiv.innerHTML = html;
        }
        function addStudentEvent(prefix, colorCode) { const text = prompt(`よていを入力してね！`); if(!text) return; let evs = loadFB('cal_events', {}); if(!evs[selectedDateStr]) evs[selectedDateStr] = []; evs[selectedDateStr].push({type: 'student', text: `${prefix} ${text}`, color: colorCode}); saveFB('cal_events', evs); }
        function deleteEvent(dateStr, idx) { if(!confirm("けす？")) return; let evs = loadFB('cal_events', {}); evs[dateStr].splice(idx, 1); if(evs[dateStr].length === 0) delete evs[dateStr]; saveFB('cal_events', evs); }

        function renderHomeworkList() {
            const events = loadFB('cal_events', {}); const doneDict = loadFB('hw_done', {}); const hiddenDict = JSON.parse(localStorage.getItem('criety_hw_hidden_' + myStudentId)) || {};
            const hwListDiv = document.getElementById('hw-list'); let hwHtml = ""; let hasHw = false; let inputIdCounter = 0;
            Object.keys(events).sort().forEach(dateStr => {
                events[dateStr].forEach(ev => {
                    if(ev.type === 'hw') {
                        const hwKey = `${dateStr}_${ev.text}`; if(hiddenDict[hwKey]) return; hasHw = true; const isDone = doneDict[hwKey];
                        if(isDone) {
                            let timeStr = (typeof isDone === 'object' && isDone.time) ? `<span style="color:#2e7d32; font-size:11px; background:#e8f5e9; padding:2px 6px; border-radius:10px;"><i class="fa-solid fa-stopwatch"></i> ${isDone.time}</span>` : '';
                            hwHtml += `<div class="hw-item done-bg"><div style="font-size:11px; color:#2e7d32; font-weight:bold; margin-bottom:4px;"><i class="fa-regular fa-calendar"></i> ${dateStr}</div><div style="font-size:14px; font-weight:bold; margin-bottom:6px; color:#1b5e20;">${ev.text}</div>${timeStr}<div style="display:flex; gap:8px; margin-top:10px;"><button class="btn-complete done" style="flex:2; background:#a0aec0; cursor:default;"><i class="fa-solid fa-check"></i> おわった！</button><button onclick="hideHw('${dateStr}', '${ev.text}')" style="flex:1; padding:8px; background:#fff; border:1px solid #ccc; color:#666; border-radius:8px; font-size:12px; font-weight:bold; cursor:pointer;">かくす</button></div></div>`;
                        } else {
                            const cid = `hw_input_${inputIdCounter}`;
                            hwHtml += `<div class="hw-item"><div style="font-size:11px; color:var(--main); font-weight:bold; margin-bottom:4px;"><i class="fa-regular fa-calendar"></i> ${dateStr}</div><div style="font-size:14px; font-weight:bold; margin-bottom:10px; color:var(--text-main);">${ev.text}</div><div style="display:flex; align-items:center; gap:5px; margin-bottom:12px; font-size:12px; font-weight:bold; color:var(--text-light);"><i class="fa-solid fa-stopwatch"></i> <input type="number" id="min_${cid}" placeholder="0" style="width:50px; padding:6px; text-align:center;"> 分 <input type="number" id="sec_${cid}" placeholder="0" style="width:50px; padding:6px; text-align:center;"> 秒</div><button class="btn-complete" onclick="markDone('${dateStr}', '${ev.text}', '${cid}')"><i class="fa-solid fa-check"></i> クリア！</button></div>`;
                            inputIdCounter++;
                        }
                    }
                });
            });
            hwListDiv.innerHTML = hasHw ? hwHtml : `<div style="text-align:center; color:var(--text-light); padding:20px 0; font-size:13px;"><i class="fa-solid fa-mug-hot" style="font-size:24px; margin-bottom:10px; display:block; color:#ccc;"></i>いまは、しゅくだいはないよ！</div>`;
        }
        function markDone(dateStr, hwText, inputId) {
            const min = document.getElementById(`min_${inputId}`).value || "0"; const sec = document.getElementById(`sec_${inputId}`).value || "0";
            const hwKey = `${dateStr}_${hwText}`; let doneDict = loadFB('hw_done', {}); if(doneDict[hwKey]) return;
            doneDict[hwKey] = { done: true, time: `${min}分${sec}秒` }; saveFB('hw_done', doneDict); saveFB_Raw('task_status', 'completed');
            let count = parseInt(studentDataCache['stamps']) || 0; let cards = parseInt(studentDataCache['stamp_cards']) || 1; count++;
            if(count >= STAMP_MAX) { saveFB_Raw('stamps', 0); saveFB_Raw('stamp_cards', cards + 1); alert("🎉 レベルアップ！次のスタンプカードへ進んだよ！"); } else { saveFB_Raw('stamps', count); }
        }
        function hideHw(dateStr, hwText) { if(!confirm("リストから消す？（先生の画面にはのこってるからだいじょうぶだよ！）")) return; const hwKey = `${dateStr}_${hwText}`; let hiddenDict = JSON.parse(localStorage.getItem('criety_hw_hidden_' + myStudentId)) || {}; hiddenDict[hwKey] = true; localStorage.setItem('criety_hw_hidden_' + myStudentId, JSON.stringify(hiddenDict)); renderHomeworkList(); }

        // ==========================================
        // 🎨 ホワイトボード（★ カメラ連携・ピンチズーム・パン完全対応）
        // ==========================================
        const canvas = document.getElementById('student-whiteboard'); 
        const ctx = canvas.getContext('2d');
        
        const offCanvas = document.createElement('canvas'); 
        offCanvas.width = 800; offCanvas.height = 600; 
        const oCtx = offCanvas.getContext('2d');
        oCtx.fillStyle = 'white'; oCtx.fillRect(0,0,800,600);

        let zoom = 1, panX = 0, panY = 0;
        let isDrawing = false, isPinching = false;
        let initialDist = 0, lastCenter = {x:0, y:0};
        let currentTool = 'pen'; let currentColor = '#ff9800'; let lineWidth = 5;

        function getRealPos(clientX, clientY) { 
            const rect = canvas.getBoundingClientRect(); 
            const sx = (clientX - rect.left) * (canvas.width / rect.width); 
            const sy = (clientY - rect.top) * (canvas.height / rect.height); 
            return { x: (sx - panX) / zoom, y: (sy - panY) / zoom }; 
        }

        function redrawCanvas() { 
            ctx.setTransform(1,0,0,1,0,0); 
            ctx.clearRect(0,0,canvas.width,canvas.height); 
            ctx.setTransform(zoom,0,0,zoom,panX,panY); 
            ctx.drawImage(offCanvas,0,0); 
        }

        function loadCameraImage(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = event => {
                const img = new Image();
                img.onload = () => {
                    oCtx.fillStyle = 'white'; oCtx.fillRect(0,0,800,600);
                    const scale = Math.min(800/img.width, 600/img.height);
                    const w = img.width * scale, h = img.height * scale;
                    oCtx.drawImage(img, (800-w)/2, (600-h)/2, w, h);
                    zoom = 1; panX = 0; panY = 0; 
                    redrawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = ""; 
        }

        function resetZoom() { zoom = 1; panX = 0; panY = 0; redrawCanvas(); }

        function handleStart(e) { 
            if(e.type === 'touchstart') e.preventDefault(); 
            if(e.touches && e.touches.length === 2) {
                isPinching = true;
                initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                lastCenter = { x: (e.touches[0].clientX + e.touches[1].clientX)/2, y: (e.touches[0].clientY + e.touches[1].clientY)/2 };
                return;
            }
            if(isPinching) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rp = getRealPos(clientX, clientY);
            if(currentTool === 'text') {
                if(!activeText) {
                    const txt = prompt("文字を入力してね:");
                    if(txt) {
                        activeText = { text: txt, x: rp.x, y: rp.y, scale: 1, angle: 0, color: currentColor };
                        savedCanvasData = oCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
                        document.getElementById('text-controls').style.display = 'flex';
                        redrawCanvas();
                    }
                } else {
                    isDraggingText = true; activeText.x = rp.x; activeText.y = rp.y; redrawCanvas();
                }
                return;
            }
            if(activeText) fixText();
            isDrawing = true; oCtx.beginPath(); oCtx.moveTo(rp.x, rp.y); 
        }

        function handleMove(e) { 
            if(e.type === 'touchmove') e.preventDefault(); 
            if(e.touches && e.touches.length === 2 && isPinching) {
                const cDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const cCenter = { x: (e.touches[0].clientX + e.touches[1].clientX)/2, y: (e.touches[0].clientY + e.touches[1].clientY)/2 };
                let nZoom = zoom * (cDist / initialDist); 
                if(nZoom < 0.5) nZoom = 0.5; if(nZoom > 5) nZoom = 5;
                const rect = canvas.getBoundingClientRect();
                const ccX = (cCenter.x - rect.left) * (canvas.width / rect.width);
                const ccY = (cCenter.y - rect.top) * (canvas.height / rect.height);
                panX = ccX - (ccX - panX) * (nZoom / zoom); panY = ccY - (ccY - panY) * (nZoom / zoom);
                panX += (cCenter.x - lastCenter.x) * (canvas.width / rect.width); panY += (cCenter.y - lastCenter.y) * (canvas.height / rect.height);
                zoom = nZoom; initialDist = cDist; lastCenter = cCenter;
                redrawCanvas(); 
                return;
            }
            if(currentTool === 'text' && isDraggingText && activeText) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const rp = getRealPos(clientX, clientY);
                activeText.x = rp.x; activeText.y = rp.y; redrawCanvas(); return;
            }
            if(!isDrawing || isPinching) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rp = getRealPos(clientX, clientY);
            oCtx.lineTo(rp.x, rp.y); oCtx.strokeStyle = currentTool === 'eraser' ? '#fff' : currentColor; 
            oCtx.lineWidth = currentTool === 'eraser' ? 40 : lineWidth; oCtx.lineCap = 'round'; oCtx.lineJoin = 'round'; oCtx.stroke(); 
            redrawCanvas(); 
        }
        
        function handleEnd(e) { if(e.touches && e.touches.length < 2) isPinching = false; isDrawing = false; }
        function setTool(t) { if(activeText && t !== 'text') fixText(); currentTool = t; document.querySelectorAll('#student-drawing-tools .tool-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-' + t).classList.add('active'); }
        function setColor(c) { currentColor = c; setTool('pen'); }
        function setLineWidth(w) { lineWidth = w; }
        function clearBoard() { if(confirm("ぜんぶ消す？")) { oCtx.fillStyle = 'white'; oCtx.fillRect(0,0,800,600); resetZoom(); activeText = null; document.getElementById('text-controls').style.display = 'none';} }
        
        // テキスト確定用関数（オフスクリーンに書き込む）
        function fixText() { 
            if(!activeText) return; 
            if(savedCanvasData) oCtx.putImageData(savedCanvasData, 0, 0);
            oCtx.save(); 
            oCtx.translate(activeText.x, activeText.y); 
            oCtx.font = `bold ${24 * activeText.scale}px sans-serif`; 
            oCtx.fillStyle = activeText.color; 
            oCtx.textAlign = 'center'; oCtx.textBaseline = 'middle'; 
            oCtx.fillText(activeText.text, 0, 0); 
            oCtx.restore();
            activeText = null; document.getElementById('text-controls').style.display = 'none';
            redrawCanvas();
        }

        canvas.addEventListener('mousedown', handleStart); canvas.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd); window.addEventListener('mouseout', handleEnd);
        canvas.addEventListener('touchstart', handleStart, { passive: false }); canvas.addEventListener('touchmove', handleMove, { passive: false }); canvas.addEventListener('touchend', handleEnd);

        function submitSlide() { 
            if(activeText) fixText();
            try { 
                let slides = loadFB('student_wb_slides', []); 
                slides.push({ id: Date.now(), data: offCanvas.toDataURL('image/jpeg', 0.8) }); 
                saveFB('student_wb_slides', slides); 
                alert("🚀 先生に送ったよ！"); 
                oCtx.fillStyle = 'white'; oCtx.fillRect(0,0,800,600); resetZoom();
            } catch(e) { alert("エラーが起きたよ。写真のサイズが大きいかも。"); } 
        }

        function renderMySentSlides() { const container = document.getElementById('my-sent-slides-container'); const slides = loadFB('student_wb_slides', []); if(slides.length === 0) { container.innerHTML = `<div style="text-align:center; color:var(--text-light); font-size:12px; padding:10px;">送ったノートはまだないよ</div>`; return; } container.innerHTML = [...slides].reverse().map((s, idx) => `<div class="slide-item"><button class="slide-delete-btn" onclick="deleteMySlide(${s.id})"><i class="fa-solid fa-xmark"></i></button><div style="font-size:11px; font-weight:bold; color:var(--text-light); margin-bottom:8px; text-align:left;">送ったノート ${slides.length - idx}</div><img src="${s.data}" onclick="openFile('${s.data}', 'img')"></div>`).join(''); }
        function deleteMySlide(id) { if(!confirm("送ったノートを取り消す？")) return; let slides = loadFB('student_wb_slides', []); slides = slides.filter(s => s.id !== id); saveFB('student_wb_slides', slides); }

        function syncData() {
            const targetTitle = studentDataCache['target_title']; 
            const targetDate = studentDataCache['target_date'];
            const area = document.getElementById('countdown-area');
            const daysEl = document.getElementById('countdown-days');
            
            // クイックメッセージ
            const quickMsg = studentDataCache['quick_message'];
            const msgArea = document.getElementById('quick-message-area');
            if (quickMsg) { msgArea.style.display = 'flex'; document.getElementById('quick-message-text').innerText = quickMsg; } 
            else { msgArea.style.display = 'none'; }
            
            if(targetTitle) {
                area.style.display = 'block'; 
                document.getElementById('countdown-title').innerHTML = `🌸 ${targetTitle}`; 
                
                if(targetDate) {
                    const today = new Date(); today.setHours(0,0,0,0);
                    const tDate = new Date(targetDate); tDate.setHours(0,0,0,0);
                    const diff = tDate - today;
                    const d = Math.ceil(diff / (1000 * 60 * 60 * 24));
                    daysEl.style.display = 'block';
                    daysEl.innerText = `あと ${d} 日`;
                } else {
                    daysEl.style.display = 'none'; 
                }
            } else { area.style.display = 'none'; }
            
            const files = loadFB('materials', []); const list = document.getElementById('material-list');
            if(files.length > 0) { list.innerHTML = files.map(f => `<div style="display:flex; align-items:center; gap:12px; padding:12px; background:#fff; border-radius:10px; border:2px solid #eee; cursor:pointer;" onclick="openFile('${f.url}', '${f.type}')"><span style="font-size:20px; color:var(--main);">${f.type==='pdf'?'<i class="fa-solid fa-file-pdf"></i>':'<i class="fa-regular fa-image"></i>'}</span><div style="font-size:13px; font-weight:bold; color:var(--text-main);">${f.name}</div></div>`).join(''); } else { list.innerHTML = `<div style="text-align:center; color:var(--text-light); font-size:12px; padding:10px;">先生からのプリントはまだないよ</div>`; }
            renderTeacherSlides();
        }

        function renderTeacherSlides() { const slides = loadFB('wb_slides', []); const boardCard = document.getElementById('shared-board-card'); const container = document.getElementById('teacher-slides-container'); if(slides.length > 0) { boardCard.style.display = 'block'; const html = [...slides].reverse().map((s, idx) => `<div class="slide-item"><div style="font-size:11px; font-weight:bold; color:var(--main); margin-bottom:8px; text-align:left;">先生のノート ${slides.length - idx}</div><img src="${s.data}" onclick="openFile('${s.data}', 'img')"></div>`).join(''); if (container.innerHTML !== html) container.innerHTML = html; } else { boardCard.style.display = 'none'; container.innerHTML = ''; } }
        function openFile(url, type) { const content = document.getElementById('file-content'); content.innerHTML = type==='pdf' ? `<iframe src="${url}" style="width:100%; height:85vh; border:none; border-radius:8px;"></iframe>` : `<img src="${url}" style="max-width:100%; max-height:85vh; border-radius:8px;">`; document.getElementById('preview-overlay').style.display='flex'; }
        function closeFile() { document.getElementById('preview-overlay').style.display='none'; }
    </script>
