<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 指導報告作成</title>
    <style>
        /* --- 基本のカラー・フォント設定 --- */
        :root {
            --bg-color: #f4f6f8; /* 背景の薄いグレー */
            --sidebar-bg: #1a2530; /* ネイビーブルー */
            --text-main: #333333;
            --text-light: #ffffff;
            --accent-color: #d4af37; /* 淡いゴールド */
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh; /* 画面いっぱいの高さ */
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* --- 左側：サイドバー --- */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .sidebar li:hover {
            color: var(--accent-color);
        }

        /* --- 右側：メインコンテンツエリア --- */
        .main-content {
            flex: 1; /* 残りの幅をすべて使う */
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        /* --- 入力と出力の2カラムレイアウト --- */
        .workspace {
            display: flex;
            gap: 20px; /* パネル間の余白 */
            flex: 1;
        }

        .panel {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            flex: 1; /* 左右同じ幅にする */
            display: flex;
            flex-direction: column;
        }

        .panel h3 {
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        /* --- フォーム部品のデザイン --- */
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .checkbox-group label {
            display: inline-block;
            margin-top: 5px;
            margin-right: 15px;
            font-weight: normal;
        }

        /* 実行ボタン */
        .btn-submit {
            margin-top: 30px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.8;
        }

        /* 出力エリアのボタン */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            padding: 10px 15px;
            background-color: #e0e4e8;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
                /* --- スマホ向けレスポンシブ対応 --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* 全体を縦並びに変更 */
                height: auto;
            }

            /* サイドバーを上部に配置して横スクロール化 */
            .sidebar {
                width: 100%;
                padding: 15px 20px;
            }

            .sidebar h2 {
                margin-bottom: 15px;
            }

            .sidebar ul {
                display: flex;
                overflow-x: auto; /* はみ出た分を横スクロール */
                white-space: nowrap; /* テキストを折り返さない */
                gap: 10px;
                padding-bottom: 5px;
            }

            .sidebar li {
                border-bottom: none;
                background-color: rgba(255, 255, 255, 0.1); /* ボタンっぽくする */
                padding: 8px 15px;
                border-radius: 20px;
            }

            /* メインコンテンツの余白調整 */
            .main-content {
                padding: 15px;
            }

            /* 入力パネルと出力パネルを縦並びに */
            .workspace {
                flex-direction: column;
            }
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Criety</h2>
        <ul>
            <li>🏠 ホーム</li>
            <li style="color: var(--accent-color);">✉️ AI連絡・報告作成</li>
            <li>📝 指導ノート＆ボード</li>
            <li>📊 学習進捗データ</li>
            <li>⚙️ 設定</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>指導報告・メッセージ作成</h1>
            <span style="font-size: 14px; color: #666;">今月のAI生成残り回数: 10 / 10回 (Free)</span>
        </div>

        <div class="workspace">
            <div class="panel input-panel">
                <h3>条件入力</h3>
                
                <label>生徒選択</label>
                <select>
                    <option value="">生徒を選択してください</option>
                    <option value="A">A君</option>
                    <option value="B">Bさん</option>
                </select>

                <label>報告のメインテーマ</label>
                <div class="checkbox-group">
                    <label><input type="checkbox"> 授業の進捗・理解度</label>
                    <label><input type="checkbox"> 宿題の達成状況</label>
                    <label><input type="checkbox"> テスト結果</label>
                </div>

                <label>小テストの点数（任意）</label>
                <input type="number" placeholder="例: 85">

                <label>文章のトーン</label>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
                    <span style="font-size: 12px;">厳しめ</span>
                    <input type="range" min="1" max="5" value="3" style="flex: 1;">
                    <span style="font-size: 12px;">褒める</span>
                </div>

                <button class="btn-submit">✨ AIで文章を生成する</button>
            </div>

            <div class="panel output-panel">
                <h3>プレビュー＆編集</h3>
                <textarea rows="18" placeholder="左の条件を入力して生成ボタンを押すと、ここにAIが作成した保護者向けの文章が表示されます。直接編集することも可能です。"></textarea>
                
                <div class="action-buttons">
                    <button class="btn-action">📋 コピー</button>
                    <button class="btn-action">💾 PDF保存</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
