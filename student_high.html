<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（高校生）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; min-height: 100vh; background: #fafafa; position: relative; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); padding-bottom: 100px; }
        
        .time-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .time-header h1 { font-size: 24px; font-weight: 800; color: #333; margin: 0; }
        
        .time-block { background: #fff; border: 1px solid #eee; border-radius: 8px; margin-bottom: 15px; display: flex; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .time-label { background: #333; color: #fff; width: 60px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .time-content { padding: 15px; flex: 1; transition: 0.3s; }
        .time-content.club { background: #f1f8e9; color: #558b2f; font-weight: bold; }
        
        .check-task { display: flex; align-items: center; justify-content: space-between; font-size: 14px; margin-bottom: 8px; padding: 8px; border-radius: 4px; background: #fff; border: 1px solid #eee; }
        .check-task.completed { background: #f5f5f5; color: #aaa; text-decoration: line-through; }
        .btn-mini { padding: 4px 10px; background: #333; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .btn-mini.done { background: #ccc; cursor: default; }

        /* --- AIアシスタント（チャット） --- */
        .chat-fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #1a2530; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: 0 4px 15px rgba(26,37,48,0.4); cursor: pointer; z-index: 9999; }
        .chat-window { position: fixed; bottom: 100px; right: 20px; width: calc(100% - 40px); max-width: 360px; height: 400px; background: #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; flex-direction: column; overflow: hidden; z-index: 9998; border: 1px solid #ddd; }
        .chat-header { background: #1a2530; color: #d4af37; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 14px; letter-spacing: 1px; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #fff; display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #eee; background: #f9f9f9; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; }
        .chat-input-area button { background: #1a2530; color: #fff; border: none; width: 60px; border-radius: 4px; margin-left: 10px; cursor: pointer; font-size: 12px; }
        .msg-bubble { max-width: 85%; padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; }
        .msg-ai { background: #f4f6f8; color: #333; align-self: flex-start; }
        .msg-student { background: #1a2530; color: #fff; align-self: flex-end; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="time-header">
            <h1>TODAY</h1>
            <div style="font-size: 14px; color: #666; font-weight: bold;">Available Study: 2.5h</div>
        </div>
        
        <div class="time-block">
            <div class="time-label">16:00</div>
            <div class="time-content club">⚽️ サッカー部 部活</div>
        </div>

        <div class="time-block">
            <div class="time-label" style="background: #0288d1;">20:00</div>
            <div class="time-content">
                <div style="font-size: 12px; color: #0288d1; font-weight: bold; margin-bottom: 10px;">帰宅後のスキマ時間</div>
                
                <div id="dynamic-high-reg-task"></div>

                <div class="check-task" id="static-task">
                    <span>英単語 ターゲット 1-100</span>
                    <button class="btn-mini" onclick="markDone('static-task', this)">完了</button>
                </div>
            </div>
        </div>

        <div class="chat-fab" onclick="toggleChat()">💡</div>
        <div class="chat-window" id="chat-window">
            <div class="chat-header"><span>AI Assistant Log</span><span style="cursor: pointer; font-size: 20px; color: #fff;" onclick="toggleChat()">×</span></div>
            <div class="chat-body" id="chat-body">
                <div class="msg-bubble msg-ai">学習アシスタントAIです。疑問点や学習計画の相談など、何でもサポートします。（会話ログは担当講師にも共有されます）</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type your question...">
                <button onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                document.getElementById('dynamic-high-reg-task').innerHTML = `
                    <div class="check-task" id="dynamic-task" style="background: #e3f2fd; border-color: #90caf9;">
                        <span style="font-weight: bold; color: #0288d1;">[NEW] ${task.content}</span>
                        <button class="btn-mini" style="background: #0288d1;" onclick="markDynamicDone(this)">完了</button>
                    </div>`;
            }
        };

        function markDynamicDone(btn) {
            btn.innerText = "Done"; btn.classList.add("done");
            document.getElementById('dynamic-task').classList.add("completed");
            localStorage.setItem('criety_task_status', 'completed');
        }

        function markDone(taskId, btn) {
            btn.innerText = "Done"; btn.classList.add("done");
            document.getElementById(taskId).classList.add("completed");
        }

        function toggleChat() {
            const chat = document.getElementById('chat-window');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            const chatBody = document.getElementById('chat-body');
            
            chatBody.innerHTML += `<div class="msg-bubble msg-student">${text}</div>`;
            input.value = ''; chatBody.scrollTop = chatBody.scrollHeight;

            let chatLog = JSON.parse(localStorage.getItem('criety_chat_log')) || [];
            chatLog.push({ sender: 'student', text: text, time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem('criety_chat_log', JSON.stringify(chatLog));

            setTimeout(() => {
                const aiReply = "その論点ですね。まずは教科書の該当ページに立ち返り、定義を確認することをお勧めします。";
                chatBody.innerHTML += `<div class="msg-bubble msg-ai">${aiReply}</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
                chatLog.push({ sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) });
                localStorage.setItem('criety_chat_log', JSON.stringify(chatLog));
            }, 1000);
        }
    </script>
</body>
</html>
