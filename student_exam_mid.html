<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（高校受験）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #333; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; background: #fff; position: relative; overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .mock-header { background: #b71c1c; color: #fff; padding: 20px; text-align: center; }
        .mock-header h1 { font-size: 14px; font-weight: normal; margin-bottom: 5px; opacity: 0.9; }
        .mock-header .score { font-size: 32px; font-weight: bold; letter-spacing: 2px; }
        
        .status-bar { display: flex; background: #212121; color: #fff; padding: 10px; font-size: 12px; justify-content: space-around; }
        .status-bar span { color: #ffeb3b; font-weight: bold; font-size: 16px; }
        
        .task-container { padding: 20px; }
        .task-item { border-left: 4px solid #b71c1c; background: #f5f5f5; padding: 15px; margin-bottom: 15px; border-radius: 0 4px 4px 0; }
        .task-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #333; }
        .task-meta { font-size: 12px; color: #666; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="mock-header">
            <h1>第3回 Vもぎ まであと</h1>
            <div class="score">18 DAYS</div>
        </div>
        
        <div class="status-bar">
            <div>志望校判定: <span>C</span></div>
            <div>目標偏差値まで: <span>+3.5</span></div>
        </div>

        <div class="task-container">
            <h2 style="font-size: 14px; color: #666; margin-bottom: 15px; text-transform: uppercase;">Action Plan</h2>
            
            <div id="dynamic-exam-mid-task"></div>

            <div class="task-item">
                <div class="task-title">英語: 長文読解タイムアタック</div>
                <div class="task-meta"><span>目標: 15分以内</span><span>重要度: 高</span></div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                const targetArea = document.getElementById('dynamic-exam-mid-task');
                if(targetArea) {
                    targetArea.innerHTML = `
                        <div class="task-item" style="border-left-color: #1976d2; background: #e3f2fd;">
                            <div style="font-size:10px; color:#1976d2; font-weight:bold; margin-bottom:3px;">🆕 先生からの追加指示</div>
                            <div class="task-title">${task.content}</div>
                            <div class="task-meta"><span>期限: ${task.date}</span></div>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
