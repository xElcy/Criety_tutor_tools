<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（中学受験）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; background: #ffffff; position: relative; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); border-top: 6px solid #0d47a1; }
        
        .exam-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        .exam-header h1 { font-size: 18px; color: #0d47a1; margin-bottom: 5px; }
        .exam-header .target { font-size: 22px; font-weight: bold; color: #333; }
        
        .parent-message { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #1565c0; position: relative; }
        .parent-message::before { content: "💬 お母さん・お父さんから"; display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #0d47a1; }
        
        .exam-task-box { border: 1px solid #ccc; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .task-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 15px; font-weight: bold; }
        .task-row input { transform: scale(1.5); margin-right: 15px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="exam-header">
            <h1>🌸 目標まであと 215 日</h1>
            <div class="target">開成中学校 合格！</div>
        </div>
        
        <div class="parent-message">
            昨日は遅くまでよく頑張ったね！今日の算数が終わったら、一緒にケーキを食べようね。
        </div>

        <h2 style="font-size: 16px; margin-bottom: 10px; color: #333;">今日の必修タスク</h2>
        
        <div id="dynamic-exam-elem-task"></div>

        <div class="exam-task-box">
            <div class="task-row"><input type="checkbox"> 算数 過去問 第3回 復習</div>
            <div style="font-size: 12px; color: #d32f2f; margin-left: 30px;">※ケアレスミスに注意！見直しを必ずする。</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                const targetArea = document.getElementById('dynamic-exam-elem-task');
                if(targetArea) {
                    targetArea.innerHTML = `
                        <div class="exam-task-box" style="border-color: #1976d2; background: #f8fbff;">
                            <div style="font-size: 12px; color: #1976d2; font-weight: bold; margin-bottom: 5px;">先生からの追加課題 (期限: ${task.date})</div>
                            <div class="task-row"><input type="checkbox"> ${task.content}</div>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
