<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（低学年）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Hiragino Maru Gothic ProN', '丸ゴシック', sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; background: #fff9e6; position: relative; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        .kids-header { text-align: center; margin-bottom: 30px; }
        .kids-header h1 { color: #ff8c00; font-size: 24px; text-shadow: 1px 1px 0 #fff; margin-bottom: 5px; }
        
        .kids-task-card { background: #fff; border: 4px solid #ffcc00; border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 0 #ffcc00; }
        .btn-kids-done { background: #ff4757; color: #fff; border: none; padding: 15px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 0 #ff0000; width: 100%; }
        .btn-kids-done:active { transform: translateY(6px); box-shadow: none; }
        
        .kids-stamp-area { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .stamp-slot { width: 50px; height: 50px; border: 3px dashed #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #fff; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="kids-header">
            <h1>✨きょうのミッション✨</h1>
        </div>
        
        <div id="dynamic-kids-task"></div>

        <div class="kids-task-card">
            <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">さんすう プリント 1まい</div>
            <button class="btn-kids-done">おわった！</button>
        </div>
        
        <div style="text-align: center; margin-top: 30px; font-weight: bold; color: #ff8c00;">シールをあつめよう！</div>
        <div class="kids-stamp-area">
            <div class="stamp-slot">🌟</div><div class="stamp-slot">🌟</div><div class="stamp-slot"></div><div class="stamp-slot"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                const targetArea = document.getElementById('dynamic-kids-task');
                if(targetArea) {
                    targetArea.innerHTML = `
                        <div class="kids-task-card" style="border-color: #2ed573; box-shadow: 0 4px 0 #2ed573;">
                            <div style="font-size: 14px; color: #2ed573; font-weight:bold;">✨せんせいから あたらしいしゅくだい！</div>
                            <div style="font-size: 18px; font-weight: bold; margin: 10px 0;">${task.content}</div>
                            <div style="font-size: 12px; color: #666; margin-bottom: 15px;">いつまで: ${task.date}</div>
                            <button class="btn-kids-done" style="background: #2ed573; box-shadow: 0 6px 0 #1e90ff;">おわった！</button>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
