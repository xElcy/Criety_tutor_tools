<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ</title>
    <style>
        :root { --bg: #fff9e6; --main: #ff9800; --accent: #29b6f6; --success: #66bb6a; --student-event: #9c27b0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Hiragino Maru Gothic ProN', sans-serif; background-color: var(--bg); color: #4a4a4a; display: flex; justify-content: center; }
        
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffb74d; z-index: 99999; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #fff; padding: 30px; border-radius: 20px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(220,140,0,0.3); }
        .auth-box input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ffe0b2; border-radius: 10px; font-size: 16px; outline: none; }
        .btn-auth { width: 100%; padding: 15px; background: var(--main); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 #f57c00; }

        .app-container { width: 100%; max-width: 400px; min-height: 100vh; background: #fffcf2; position: relative; padding: 20px; padding-bottom: 50px; }
        
        .mid-countdown { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #fff; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 6px 15px rgba(255,154,158,0.4); }
        
        .mid-card { background: #fff; border-radius: 20px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #fff3e0; }
        .mid-card h3 { font-size: 16px; color: var(--main); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        
        /* 📅 ミニカレンダー */
        .mini-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: 10px; text-align: center; }
        .cal-day-head { font-weight: bold; padding-bottom: 5px; color: #999; }
        .cal-day { border: 1px solid #f0f0f0; border-radius: 5px; min-height: 45px; padding: 2px; position: relative; }
        .cal-day.today { background: #fff9c4; border-color: var(--main); }
        .cal-badge { font-size: 8px; border-radius: 2px; color: white; display: block; margin-top: 1px; overflow: hidden; white-space: nowrap; }

        /* 💮 スタンプ帳 */
        .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; }
        .stamp-slot { width: 100%; aspect-ratio: 1; border: 2px dashed #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #fafafa; }
        .stamp-slot.filled { border-style: solid; border-color: #ffcdd2; background: #fff; animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* 📚 教材閲覧 */
        .file-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #f9f9f9; cursor: pointer; transition: 0.2s; }
        .file-item:hover { background: #f0f8ff; }
        .file-icon { font-size: 20px; }

        .btn-complete { padding: 12px; background: var(--success); color: #fff; border: none; border-radius: 50px; font-weight: bold; width: 100%; cursor: pointer; box-shadow: 0 4px 0 #43a047; }
        .btn-complete.done { background: #bdbdbd; box-shadow: none; transform: translateY(4px); }
        
        .settings-btn { text-align: center; margin-top: 20px; color: #aaa; font-size: 12px; cursor: pointer; }

        /* プレビュー表示 */
        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100000; flex-direction: column; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2 style="color:var(--main)">Criety ログイン</h2>
            <input type="text" id="student-email" placeholder="ユーザーID (kage)">
            <input type="password" id="student-password" placeholder="パスワード (123)">
            <button class="btn-auth" onclick="studentLogin()">はじめる！</button>
        </div>
    </div>

    <div id="preview-overlay">
        <div style="background:#fff; padding:10px; text-align:right;"><button onclick="closeFile()">閉じる ✖</button></div>
        <div id="file-content" style="flex:1; overflow:auto; display:flex; justify-content:center; align-items:center;"></div>
    </div>

    <div class="app-container">
        
        <div class="mid-countdown" id="countdown-area">
            <h2 id="countdown-title">🌸 目標</h2>
            <div id="countdown-days" style="font-size:36px; font-weight:bold;">- 日</div>
        </div>

        <div class="mid-card">
            <h3>💮 ごほうびスタンプ</h3>
            <div class="stamp-grid" id="stamp-grid"></div>
            <p style="font-size:10px; text-align:right; margin-top:10px; color:#999;">しゅくだいをクリアすると貯まるよ！</p>
        </div>
        
        <div class="mid-card">
            <h3>📅 よてい表</h3>
            <div class="mini-calendar" id="mini-calendar"></div>
            <button onclick="addStudentEvent()" style="width:100%; margin-top:10px; font-size:12px; padding:5px; border-radius:5px; border:1px solid #ccc; background:#fff; cursor:pointer;">➕ じぶんの予定を入れる</button>
        </div>

        <div class="mid-card">
            <h3>📚 せんせいからの教材</h3>
            <div id="material-list">
                <p style="font-size:12px; color:#999; text-align:center; padding:10px;">まだ教材はありません✨</p>
            </div>
        </div>

        <div class="mid-card">
            <h3>📝 きょうの しゅくだい</h3>
            <div id="dynamic-mid-task"><p style="font-size:12px; color:#999; text-align:center;">なし</p></div>
        </div>

        <div class="mid-card" id="shared-board-card" style="display: none;">
            <h3>👨‍🏫 せんせいのホワイトボード</h3>
            <img id="shared-whiteboard-img" src="" style="width: 100%; border-radius: 10px;">
        </div>

        <div class="settings-btn" onclick="studentLogout()">🚪 ログアウト</div>
    </div>

    <script>
        let myStudentId = "";
        const STAMP_MAX = 10;

        document.addEventListener("DOMContentLoaded", () => {
            if(localStorage.getItem('student_elementary_logged_in') === 'true') {
                myStudentId = localStorage.getItem('my_student_id') || "kage";
                document.getElementById('auth-overlay').style.display = 'none';
                renderStamps();
                renderCalendar();
            }
        });

        function studentLogin() {
            const id = document.getElementById('student-email').value.trim();
            const pass = document.getElementById('student-password').value.trim();
            if(id === 'kage' && pass === '123') {
                myStudentId = id;
                localStorage.setItem('student_elementary_logged_in', 'true');
                localStorage.setItem('my_student_id', id);
                document.getElementById('auth-overlay').style.display = 'none';
                renderStamps();
                renderCalendar();
            } else { alert("IDかパスワードがちがうよ！"); }
        }

        function studentLogout() { localStorage.clear(); location.reload(); }

        // 💮 スタンプ表示
        function renderStamps() {
            const count = parseInt(localStorage.getItem('criety_stamps_' + myStudentId)) || 0;
            const grid = document.getElementById('stamp-grid');
            grid.innerHTML = "";
            for(let i=1; i<=STAMP_MAX; i++) {
                const slot = document.createElement('div');
                slot.className = i <= count ? "stamp-slot filled" : "stamp-slot";
                slot.innerHTML = i <= count ? "💮" : "";
                grid.appendChild(slot);
            }
        }

        // 📅 カレンダー表示
        function renderCalendar() {
            const grid = document.getElementById('mini-calendar');
            grid.innerHTML = "";
            const today = new Date();
            const year = today.getFullYear(), month = today.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const events = JSON.parse(localStorage.getItem('criety_cal_events_' + myStudentId)) || {};

            ['日','月','火','水','木','金','土'].forEach(h => grid.innerHTML += `<div class="cal-day-head">${h}</div>`);

            const startDay = new Date(year, month, 1).getDay();
            for(let i=0; i<startDay; i++) grid.innerHTML += `<div></div>`;

            for(let i=1; i<=daysInMonth; i++) {
                const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                let badgeHtml = "";
                if(events[dStr]) {
                    events[dStr].forEach(ev => {
                        let color = ev.type==='hw' ? '#ff9800' : (ev.type==='lesson' ? '#2196f3' : '#9c27b0');
                        badgeHtml += `<span class="cal-badge" style="background:${color}">${ev.text}</span>`;
                    });
                }
                grid.innerHTML += `<div class="cal-day ${i===today.getDate()?'today':''}"><b>${i}</b>${badgeHtml}</div>`;
            }
        }

        function addStudentEvent() {
            const text = prompt("なにをする？ (例: じしゅう、読書)");
            if(!text) return;
            const today = new Date();
            const dStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            let evs = JSON.parse(localStorage.getItem('criety_cal_events_' + myStudentId)) || {};
            if(!evs[dStr]) evs[dStr] = [];
            evs[dStr].push({type: 'student', text: text});
            localStorage.setItem('criety_cal_events_' + myStudentId, JSON.stringify(evs));
            renderCalendar();
            alert("よていを保存したよ！先生にも見えてるよ。");
        }

        // 🔄 先生側からの同期
        setInterval(() => {
            if(!myStudentId) return;

            // 教材の同期
            const files = JSON.parse(localStorage.getItem('criety_materials_' + myStudentId)) || [];
            const list = document.getElementById('material-list');
            if(files.length > 0) {
                list.innerHTML = files.map(f => `
                    <div class="file-item" onclick="openFile('${f.url}', '${f.type}')">
                        <span class="file-icon">${f.type==='pdf'?'📄':'🖼️'}</span>
                        <div style="font-size:12px;"><b>${f.name}</b><br><span style="color:#999;">タップでみる</span></div>
                    </div>
                `).join('');
            }

            // 宿題の同期
            const t = localStorage.getItem('criety_new_task_' + myStudentId);
            const status = localStorage.getItem('criety_task_status_' + myStudentId);
            if(t) {
                const task = JSON.parse(t);
                document.getElementById('dynamic-mid-task').innerHTML = `
                    <div style="background:#e8f5e9; padding:10px; border-radius:10px;">
                        <strong>🆕 ${task.content}</strong><br>
                        <button class="btn-complete ${status==='completed'?'done':''}" 
                                onclick="${status==='completed'?'':'markDone()'}">
                            ${status==='completed'?'クリア！🌟':'おわったよ！💮'}
                        </button>
                    </div>`;
            }

            // 目標とホワイトボード（省略せず実装）
            const targetTitle = localStorage.getItem('criety_target_title_' + myStudentId);
            const targetDays = localStorage.getItem('criety_target_days_' + myStudentId);
            if(targetTitle && targetDays) {
                document.getElementById('countdown-area').style.display = 'block';
                document.getElementById('countdown-title').innerText = `🌸 ${targetTitle} あと`;
                document.getElementById('countdown-days').innerText = `${targetDays} 日`;
            }
            const board = localStorage.getItem('criety_shared_whiteboard_' + myStudentId);
            if(board) {
                document.getElementById('shared-board-card').style.display = 'block';
                document.getElementById('shared-whiteboard-img').src = board;
            }
        }, 2000);

        function markDone() {
            localStorage.setItem('criety_task_status_' + myStudentId, 'completed');
            // スタンプ追加
            let count = parseInt(localStorage.getItem('criety_stamps_' + myStudentId)) || 0;
            localStorage.setItem('criety_stamps_' + myStudentId, count + 1);
            renderStamps();
            alert("すごーい！スタンプを 1こ おしたよ！💮");
        }

        function openFile(url, type) {
            const content = document.getElementById('file-content');
            if(type === 'pdf') {
                content.innerHTML = `<iframe src="${url}" style="width:100%; height:100%; border:none;"></iframe>`;
            } else {
                content.innerHTML = `<img src="${url}" style="max-width:100%; height:auto;">`;
            }
            document.getElementById('preview-overlay').style.display = 'flex';
        }
        function closeFile() { document.getElementById('preview-overlay').style.display = 'none'; }
    </script>
</body>
</html>
