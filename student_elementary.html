<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（中学受験用）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Helvetica Neue', Arial, sans-serif; background-color: #fff9e6; display: flex; justify-content: center; color: #4a4a4a; }
        
        /* 🔒 ログイン画面（ポップで優しく） */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffb74d; z-index: 99999; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #fff; padding: 30px; border-radius: 20px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(220, 140, 0, 0.3); }
        .auth-box input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ffe0b2; border-radius: 10px; font-size: 16px; outline: none; }
        .auth-box input:focus { border-color: #ff9800; }
        .btn-auth { width: 100%; padding: 15px; background: #ff9800; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #f57c00; }
        .btn-auth:active { transform: translateY(4px); box-shadow: none; }

        /* アプリ全体 */
        .app-container { width: 100%; max-width: 400px; min-height: 100vh; background: #fffcf2; position: relative; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        
        /* カウントダウン（桜・合格祈願カラー） */
        .mid-countdown { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #fff; padding: 25px 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 6px 15px rgba(255, 154, 158, 0.4); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .mid-countdown h2 { font-size: 18px; margin: 0 0 10px 0; }
        
        /* カードデザイン */
        .mid-card { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #fff3e0; }
        .mid-card h3 { font-size: 16px; color: #ff9800; margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px; }
        
        /* しゅくだいボタン */
        .btn-complete { padding: 10px 20px; background: #66bb6a; color: #fff; border: none; border-radius: 50px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 0 #43a047; transition: 0.2s; }
        .btn-complete:active { transform: translateY(4px); box-shadow: none; }
        .btn-complete.done { background: #bdbdbd; box-shadow: 0 4px 0 #9e9e9e; cursor: default; transform: translateY(4px); box-shadow: none;}
        
        /* チャット機能 */
        .chat-fab { position: fixed; bottom: 30px; right: 20px; width: 70px; height: 70px; background: #29b6f6; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; box-shadow: 0 6px 20px rgba(41, 182, 246, 0.5); cursor: pointer; z-index: 9999; animation: bounce 2s infinite; border: 4px solid #fff; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
        
        .chat-window { position: fixed; bottom: 110px; right: 20px; width: calc(100% - 40px); max-width: 360px; height: 450px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; z-index: 9998; border: 4px solid #29b6f6; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #e1f5fe; display: flex; flex-direction: column; gap: 12px; }
        .chat-input-area { display: flex; padding: 15px; border-top: 2px solid #eee; background: #fff; }
        .chat-input-area input { flex: 1; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 25px; outline: none; font-size: 14px; }
        .chat-input-area input:focus { border-color: #29b6f6; }
        
        .msg-bubble { max-width: 85%; padding: 12px 18px; border-radius: 20px; font-size: 14px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .msg-ai { background: #fff; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; border: 2px solid #b3e5fc; }
        .msg-student { background: #29b6f6; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: bold; }
        
        /* ログアウト */
        .settings-btn { text-align: center; margin-top: 30px; color: #ffb74d; font-size: 14px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2 style="margin-bottom: 20px; color: #ff9800;">🌸 がんばるぞ！</h2>
            <input type="text" id="student-email" placeholder="メールアドレス">
            <input type="password" id="student-password" placeholder="パスワード">
            <button class="btn-auth" onclick="studentLogin()">はじめる！</button>
            <p style="font-size: 12px; color: #999; margin-top: 15px;">※せんせいからもらったパスワードをいれてね</p>
        </div>
    </div>

    <div class="app-container">
        <div class="mid-countdown">
            <h2>🌸 中学受験 本番まで あと</h2>
            <div style="font-size:42px; font-weight:bold; letter-spacing: 2px;">214 日</div>
        </div>
        
        <div class="mid-card" id="shared-board-card" style="display: none; border: 3px solid #ffb74d;">
            <h3>👨‍🏫 せんせいの ホワイトボード <span id="board-update-badge" style="display:none; background:#ff4757; color:white; font-size:12px; padding:4px 8px; border-radius:10px; margin-left: auto;">あたらしい！</span></h3>
            <img id="shared-whiteboard-img" src="" style="width: 100%; border-radius: 10px; background: #fff;">
        </div>
        
        <div class="mid-card">
            <h3>📚 きょうの しゅくだい</h3>
            <div id="dynamic-mid-task">
                <div style="text-align: center; color: #999; font-size: 14px; padding: 10px 0;">いまは しゅくだいは ありません✨</div>
            </div>
        </div>

        <div class="settings-btn" onclick="studentLogout()">🚪 ログアウトする</div>

        <div class="chat-fab" onclick="toggleChat()">🦉</div>
        <div class="chat-window" id="chat-window">
            <div style="background:#29b6f6; color:#fff; padding:15px; font-weight:bold; display:flex; justify-content:space-between; align-items: center;">
                <span style="font-size: 16px;">🦉 AI先生に しつもん</span>
                <span onclick="toggleChat()" style="cursor:pointer; font-size: 24px; line-height: 1;">×</span>
            </div>
            <div class="chat-body" id="chat-body">
                <div class="msg-bubble msg-ai">こんにちは！わからない問題があったら、いつでもきいてね。いっしょに受験べんきょう がんばろう！🌟</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="ここにしつもんをかいてね...">
                <button onclick="sendMessage()" style="background:#ff9800; border:none; width:45px; height:45px; border-radius:50%; color:white; font-size: 18px; margin-left: 10px; cursor: pointer; box-shadow: 0 3px 0 #f57c00;">➤</button>
            </div>
        </div>
    </div>

    <script>
        // 🔒 ログイン処理
        document.addEventListener("DOMContentLoaded", () => {
            if(localStorage.getItem('student_elementary_logged_in') === 'true') {
                document.getElementById('auth-overlay').style.display = 'none';
            }
        });
        function studentLogin() {
            localStorage.setItem('student_elementary_logged_in', 'true');
            document.getElementById('auth-overlay').style.display = 'none';
        }
        function studentLogout() {
            localStorage.removeItem('student_elementary_logged_in');
            location.reload();
        }

        // 📚 宿題とホワイトボードの同期
        setInterval(() => {
            // 宿題の同期
            const t = localStorage.getItem('criety_new_task');
            const status = localStorage.getItem('criety_task_status');
            
            if(t) {
                const task = JSON.parse(t);
                const taskContainer = document.getElementById('dynamic-mid-task');
                
                // まだタスク要素がない、または内容が変わった場合に描画
                if(!document.getElementById('dynamic-task') || document.getElementById('dynamic-task-content').innerText !== `🆕 ${task.content}`) {
                    let btnHtml = `<button class="btn-complete" style="margin-top:15px; width: 100%;" onclick="markDone()">できた！💮</button>`;
                    let bgStyle = "background:#fff3e0; border: 2px solid #ffe0b2;";
                    
                    if (status === 'completed' || status === 'notified') {
                        btnHtml = `<button class="btn-complete done" style="margin-top:15px; width: 100%;">クリア！🌟</button>`;
                        bgStyle = "background:#e8f5e9; border: 2px solid #c8e6c9;";
                    }

                    taskContainer.innerHTML = `
                        <div id="dynamic-task" style="${bgStyle} padding:15px; border-radius:15px; transition: 0.3s;">
                            <strong id="dynamic-task-content" style="font-size: 16px; display: block; color: #d84315;">🆕 ${task.content}</strong>
                            ${btnHtml}
                        </div>`;
                }
            }
            
            // ホワイトボードの同期
            const board = localStorage.getItem('criety_shared_whiteboard');
            const img = document.getElementById('shared-whiteboard-img');
            if(board) {
                document.getElementById('shared-board-card').style.display = 'block';
                if(img.src !== board) {
                    img.src = board;
                    const badge = document.getElementById('board-update-badge');
                    badge.style.display = 'inline-block';
                    setTimeout(() => badge.style.display = 'none', 4000);
                }
            }
        }, 1000);

        function markDone() {
            localStorage.setItem('criety_task_status', 'completed');
            // 即座に見た目を更新
            const taskDiv = document.getElementById('dynamic-task');
            taskDiv.style.background = '#e8f5e9';
            taskDiv.style.borderColor = '#c8e6c9';
            const btn = taskDiv.querySelector('button');
            btn.className = 'btn-complete done';
            btn.innerText = 'クリア！🌟';
            btn.onclick = null;
        }

        // 🤖 Gemini API チャット機能（小学生・中学受験特化プロンプト）
        function toggleChat() { 
            const window = document.getElementById('chat-window');
            window.style.display = window.style.display === 'flex' ? 'none' : 'flex'; 
        }
        
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            const chatBody = document.getElementById('chat-body');
            chatBody.innerHTML += `<div class="msg-bubble msg-student">${text}</div>`;
            input.value = ''; 
            chatBody.scrollTop = chatBody.scrollHeight;

            // 先生側へログを送信
            let log = JSON.parse(localStorage.getItem('criety_chat_log')) || [];
            log.push({ sender: 'student', text: text, time: new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) });
            localStorage.setItem('criety_chat_log', JSON.stringify(log));

            const apiKey = localStorage.getItem('gemini_api_key'); 
            if(!apiKey) {
                chatBody.innerHTML += `<div class="msg-bubble msg-ai" style="color:#d32f2f;">せんせいの パソコンで、AIの せっていをしてね！</div>`;
                return;
            }

            // ★ 中学受験向け専用プロンプト
            const systemPrompt = `あなたは中学受験を目指す小学生をサポートする、優しくて頼りになるAIチューター（フクロウの先生）です。
以下のルールに必ず従って回答してください：
1. 難しい漢字は使わず、ひらがなを多めにして小学生が読みやすい文章にすること。
2. 「すごいね！」「がんばってるね！」など、勉強のモチベーションが上がるポジティブな言葉を必ず入れること。
3. 答えを直接教えるのではなく、ヒントを出して自分で考えさせるようにすること。
4. 長すぎる文章は避け、短く端的に答えること。

生徒からの質問：${text}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                });
                const data = await response.json();
                const aiReply = data.candidates[0].content.parts[0].text;
                
                chatBody.innerHTML += `<div class="msg-bubble msg-ai">${aiReply}</div>`;
                log.push({ sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) });
                localStorage.setItem('criety_chat_log', JSON.stringify(log));
            } catch (e) {
                chatBody.innerHTML += `<div class="msg-bubble msg-ai" style="color:#d32f2f;">ちょっと エラーがおきちゃったみたい。もういちど きいてみてね！</div>`;
            }
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>
</html>
