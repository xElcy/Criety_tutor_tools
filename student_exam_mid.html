<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（高校受験）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #333; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; min-height: 100vh; background: #fafafa; position: relative; overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); padding-bottom: 100px; }
        
        .mock-header { background: #b71c1c; color: #fff; padding: 20px; text-align: center; border-bottom: 4px solid #7f0000; }
        .mock-header h1 { font-size: 13px; font-weight: normal; margin-bottom: 5px; opacity: 0.8; letter-spacing: 1px; }
        .mock-header .score { font-size: 30px; font-weight: bold; letter-spacing: 1px; }
        
        .status-bar { display: flex; background: #212121; color: #fff; padding: 12px; font-size: 13px; justify-content: space-around; }
        .status-bar span { color: #ffeb3b; font-weight: bold; font-size: 16px; }
        
        .task-container { padding: 20px; }
        .task-item { border-left: 4px solid #b71c1c; background: #fff; padding: 15px; margin-bottom: 12px; border-radius: 0 8px 8px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .task-item.completed { border-left-color: #9e9e9e; background: #f5f5f5; color: #aaa; }
        .task-item.completed .task-title { text-decoration: line-through; color: #aaa; }
        
        .task-title { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 4px; }
        .btn-action-clear { padding: 6px 15px; background: #b71c1c; color: #fff; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-action-clear.done { background: #9e9e9e; cursor: default; }

        /* --- 解法マスター（AIチャット） --- */
        .chat-fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #b71c1c; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 26px; box-shadow: 0 4px 15px rgba(183,28,28,0.4); cursor: pointer; z-index: 9999; }
        .chat-window { position: fixed; bottom: 100px; right: 20px; width: calc(100% - 40px); max-width: 360px; height: 400px; background: #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; z-index: 9998; border: 2px solid #b71c1c; }
        .chat-header { background: #b71c1c; color: #fff; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #fffaf0; display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #ffcdd2; background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; }
        .chat-input-area button { background: #b71c1c; color: #fff; border: none; width: 50px; border-radius: 4px; margin-left: 10px; cursor: pointer; font-weight: bold; }
        
        .msg-bubble { max-width: 85%; padding: 10px 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; }
        .msg-ai { background: #fff; border: 1px solid #b71c1c; color: #7f0000; align-self: flex-start; }
        .msg-student { background: #b71c1c; color: #fff; align-self: flex-end; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="mock-header">
            <h1>都道府県 統一模擬試験 まであと</h1>
            <div class="score">18 DAYS</div>
        </div>
        
        <div class="status-bar">
            <div>志望校判定: <span>C</span></div>
            <div>目標偏差値まで: <span>+3.5</span></div>
        </div>

        <div class="task-container">
            <h2 style="font-size: 14px; color: #666; margin-bottom: 12px; font-weight: bold; letter-spacing: 0.5px;">🔥 今日の限界突破タスク</h2>
            
            <div id="dynamic-exam-mid-task"></div>

            <div class="task-item" id="static-task">
                <div>
                    <div class="task-title">英語：長文読解の速読トレーニング</div>
                    <div style="font-size: 11px; color: #7f0000;">目安時間：20分 / 配点高い長文を攻略せよ</div>
                </div>
                <button class="btn-action-clear" onclick="markDone('static-task', this)">クリア</button>
            </div>
        </div>

        <div class="chat-fab" onclick="toggleChat()">⚔️</div>
        <div class="chat-window" id="chat-window">
            <div class="chat-header"><span>⚔️ 解法マスターAIの戦術室</span><span style="cursor: pointer; font-size: 20px;" onclick="toggleChat()">×</span></div>
            <div class="chat-body" id="chat-body">
                <div class="msg-bubble msg-ai">模試や過去問で勝つための戦術を授けよう。解けない問題、苦手な大問の形式を教えてくれ。（ログは先生にもリアルタイムで同期中だ）</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="問題の特徴を入力...">
                <button onclick="sendMessage()">送信</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                document.getElementById('dynamic-exam-mid-task').innerHTML = `
                    <div class="task-item" id="dynamic-task" style="border-left-color: #2e7d32; background: #f1f8e9;">
                        <div>
                            <div style="font-size:10px; color:#2e7d32; font-weight:bold; margin-bottom:3px;">🆕 先生が配備した特訓課題</div>
                            <div class="task-title" style="color: #1b5e20;">${task.content}</div>
                        </div>
                        <button class="btn-action-clear" style="background: #2e7d32;" onclick="markDynamicDone(this)">クリア</button>
                    </div>`;
            }
        };

        function markDynamicDone(btn) {
            btn.innerText = "CLEAR!"; btn.classList.add("done");
            document.getElementById('dynamic-task').classList.add("completed");
            localStorage.setItem('criety_task_status', 'completed');
        }

        function markDone(taskId, btn) {
            btn.innerText = "CLEAR!"; btn.classList.add("done");
            document.getElementById(taskId).classList.add("completed");
        }

        function toggleChat() {
            const chat = document.getElementById('chat-window');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            const chatBody = document.getElementById('chat-body');
            
            chatBody.innerHTML += `<div class="msg-bubble msg-student">${text}</div>`;
            input.value = ''; chatBody.scrollTop = chatBody.scrollHeight;

            let chatLog = JSON.parse(localStorage.getItem('criety_chat_log')) || [];
            chatLog.push({ sender: 'student', text: text, time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem('criety_chat_log', JSON.stringify(chatLog));

            setTimeout(() => {
                const aiReply = "数学の関数の記述問題だな。まずはy軸との交点、そして直線の傾きを求める手順を答案に書き出すんだ。部分点を確実にもぎ取ろう。";
                chatBody.innerHTML += `<div class="msg-bubble msg-ai">${aiReply}</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
                chatLog.push({ sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) });
                localStorage.setItem('criety_chat_log', JSON.stringify(chatLog));
            }, 1000);
        }
    </script>
</body>
</html>
