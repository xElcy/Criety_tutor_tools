<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（中学受験用）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Helvetica Neue', Arial, sans-serif; background-color: #fff9e6; display: flex; justify-content: center; color: #4a4a4a; }
        
        /* 🔒 ログイン画面（入力必須・完全に中身を隠す） */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffb74d; z-index: 99999; display: flex; justify-content: center; align-items: center; }
        .auth-box { background: #fff; padding: 30px; border-radius: 20px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(220, 140, 0, 0.3); }
        .auth-box h2 { margin-bottom: 5px; color: #e65100; font-size: 22px; }
        .auth-box p { font-size: 12px; color: #666; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 15px; margin-bottom: 15px; border: 2px solid #ffe0b2; border-radius: 10px; font-size: 16px; outline: none; }
        .auth-box input:focus { border-color: #ff9800; }
        .btn-auth { width: 100%; padding: 15px; background: #ff9800; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #f57c00; }
        .btn-auth:active { transform: translateY(4px); box-shadow: none; }

        /* アプリ全体 */
        .app-container { width: 100%; max-width: 400px; min-height: 100vh; background: #fffcf2; position: relative; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        
        /* 動的カウントダウン */
        .mid-countdown { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color: #fff; padding: 25px 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 6px 15px rgba(255, 154, 158, 0.4); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); display: none; /* 初期状態は非表示 */ }
        .mid-countdown h2 { font-size: 18px; margin: 0 0 10px 0; }
        
        /* カードデザイン */
        .mid-card { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #fff3e0; }
        .mid-card h3 { font-size: 16px; color: #ff9800; margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px; }
        
        /* しゅくだいボタン */
        .btn-complete { padding: 10px 20px; background: #66bb6a; color: #fff; border: none; border-radius: 50px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 0 #43a047; transition: 0.2s; }
        .btn-complete:active { transform: translateY(4px); box-shadow: none; }
        .btn-complete.done { background: #bdbdbd; box-shadow: none; cursor: default; transform: translateY(4px); }
        
        /* チャット機能 */
        .chat-fab { position: fixed; bottom: 30px; right: 20px; width: 70px; height: 70px; background: #29b6f6; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; box-shadow: 0 6px 20px rgba(41, 182, 246, 0.5); cursor: pointer; z-index: 9999; animation: bounce 2s infinite; border: 4px solid #fff; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
        
        .chat-window { position: fixed; bottom: 110px; right: 20px; width: calc(100% - 40px); max-width: 360px; height: 450px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; z-index: 9998; border: 4px solid #29b6f6; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #e1f5fe; display: flex; flex-direction: column; gap: 12px; }
        .chat-input-area { display: flex; padding: 15px; border-top: 2px solid #eee; background: #fff; }
        .chat-input-area input { flex: 1; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 25px; outline: none; font-size: 14px; }
        
        .msg-bubble { max-width: 85%; padding: 12px 18px; border-radius: 20px; font-size: 14px; line-height: 1.5; }
        .msg-ai { background: #fff; color: #333; align-self: flex-start; border-radius: 20px 20px 20px 4px; border: 2px solid #b3e5fc; }
        .msg-student { background: #29b6f6; color: #fff; align-self: flex-end; border-radius: 20px 20px 4px 20px; font-weight: bold; }
        
        .settings-btn { text-align: center; margin-top: 30px; color: #ffb74d; font-size: 14px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2>Criety ログイン</h2>
            <p>きめられた ID と パスワードをいれてね！</p>
            <input type="text" id="student-email" placeholder="ユーザーID">
            <input type="password" id="student-password" placeholder="パスワード">
            <button class="btn-auth" onclick="studentLogin()">はじめる！</button>
        </div>
    </div>

    <div class="app-container">
        
        <div class="mid-countdown" id="countdown-area">
            <h2 id="countdown-title">🌸 目標タイトル</h2>
            <div id="countdown-days" style="font-size:42px; font-weight:bold; letter-spacing: 2px;">- 日</div>
        </div>
        
        <div class="mid-card" id="shared-board-card" style="display: none; border: 3px solid #ffb74d;">
            <h3>👨‍🏫 せんせいの ホワイトボード <span id="board-update-badge" style="display:none; background:#ff4757; color:white; font-size:12px; padding:4px 8px; border-radius:10px; margin-left: auto;">あたらしい！</span></h3>
            <img id="shared-whiteboard-img" src="" style="width: 100%; border-radius: 10px; background: #fff;">
        </div>
        
        <div class="mid-card">
            <h3>📚 きょうの しゅくだい</h3>
            <div id="dynamic-mid-task">
                <div id="no-task-message" style="text-align: center; color: #999; font-size: 14px; padding: 10px 0;">いまは しゅくだいは ありません✨</div>
            </div>
        </div>

        <div class="settings-btn" onclick="studentLogout()">🚪 ログアウトする</div>

        <div class="chat-fab" onclick="toggleChat()">🦉</div>
        <div class="chat-window" id="chat-window">
            <div style="background:#29b6f6; color:#fff; padding:15px; font-weight:bold; display:flex; justify-content:space-between; align-items: center;">
                <span style="font-size: 16px;">🦉 AI先生に しつもん</span>
                <span onclick="toggleChat()" style="cursor:pointer; font-size: 24px; line-height: 1;">×</span>
            </div>
            <div class="chat-body" id="chat-body">
                <div class="msg-bubble msg-ai">こんにちは！わからない問題があったら、いつでもきいてね。いっしょに受験べんきょう がんばろう！🌟</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="ここにしつもんをかいてね...">
                <button onclick="sendMessage()" style="background:#ff9800; border:none; width:45px; height:45px; border-radius:50%; color:white; font-size: 18px; margin-left: 10px; cursor: pointer; box-shadow: 0 3px 0 #f57c00;">➤</button>
            </div>
        </div>
    </div>

    <script>
        // 🔒 厳格なログイン認証処理
        document.addEventListener("DOMContentLoaded", () => {
            if(localStorage.getItem('student_elementary_logged_in') === 'true') {
                document.getElementById('auth-overlay').style.display = 'none';
            }
        });

        function studentLogin() {
            const id = document.getElementById('student-email').value.trim();
            const pass = document.getElementById('student-password').value.trim();
            
            // kage / 123 の完全一致チェック
            if(id === 'kage' && pass === '123') {
                localStorage.setItem('student_elementary_logged_in', 'true');
                document.getElementById('auth-overlay').style.display = 'none';
            } else {
                alert("❌ ID または パスワードが まちがっているよ！");
            }
        }

        function studentLogout() {
            localStorage.removeItem('student_elementary_logged_in');
            location.reload();
        }

        setInterval(() => {
