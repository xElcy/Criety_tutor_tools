<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - デベロッパー統括ダッシュボード</title>
    <style>
        :root {
            --sidebar-bg: #1a2530;
            --accent: #d4af37;
            --bg-dark: #0f171e;
            --text-light: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-dark); color: var(--text-light); display: flex; height: 100vh; overflow: hidden; }

        /* --- 左側：コントロールパネル --- */
        .admin-sidebar { width: 300px; background-color: var(--sidebar-bg); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #333; overflow-y: auto; }
        .admin-sidebar h1 { color: var(--accent); font-size: 20px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .admin-sidebar p { font-size: 12px; color: #888; margin-bottom: 30px; }

        .menu-section { margin-bottom: 25px; }
        .menu-section h2 { font-size: 12px; color: #666; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; text-transform: uppercase; }
        
        .menu-btn { display: block; width: 100%; text-align: left; background: transparent; color: #ccc; border: 1px solid transparent; padding: 12px 15px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .menu-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .menu-btn.active { background: rgba(212, 175, 55, 0.1); color: var(--accent); border-color: var(--accent); font-weight: bold; }

        /* --- 右側：プレビューエリア --- */
        .preview-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #2a3b4c 0%, var(--bg-dark) 100%); position: relative; }
        
        .preview-header { position: absolute; top: 20px; left: 30px; }
        .preview-header h2 { font-size: 18px; margin-bottom: 5px; }
        .preview-header .url-display { font-size: 12px; color: #888; background: #000; padding: 5px 10px; border-radius: 4px; font-family: monospace; }

        /* スマホのモックアップフレーム */
        .device-frame { width: 400px; height: 800px; background: #fff; border: 12px solid #222; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        /* iPhoneのノッチ風デザイン */
        .device-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 150px; height: 25px; background: #222; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 10; }
        
        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        /* PC画面プレビュー用のフレーム切り替え */
        .device-frame.is-pc { width: 90%; height: 85%; border-radius: 10px; border-width: 8px; }
        .device-frame.is-pc .device-notch { display: none; }
    </style>
</head>
<body>

    <div class="admin-sidebar">
        <h1>Criety Admin</h1>
        <p>Developer Preview Hub</p>

        <div class="menu-section">
            <h2>Teacher Dashboard</h2>
            <button class="menu-btn" onclick="loadPage('index.html', '👨‍🏫 先生用 統合ダッシュボード', 'pc', this)">index.html (先生用 / PC推奨)</button>
        </div>

        <div class="menu-section">
            <h2>Student Apps (Mobile)</h2>
            <button class="menu-btn active" onclick="loadPage('student_low_elem.html', '👦 小学校低学年用 UI', 'mobile', this)">1. student_low_elem.html</button>
            <button class="menu-btn" onclick="loadPage('student_high_elem.html', '⚔️ 小学校高学年用 (RPG) UI', 'mobile', this)">2. student_high_elem.html</button>
            <button class="menu-btn" onclick="loadPage('student_exam_elem.html', '🌸 中学受験 小学生用 UI', 'mobile', this)">3. student_exam_elem.html</button>
            <button class="menu-btn" onclick="loadPage('student_middle.html', '📝 中学生用 (定期テスト) UI', 'mobile', this)">4. student_middle.html</button>
            <button class="menu-btn" onclick="loadPage('student_exam_mid.html', '🔥 高校受験 中学生用 UI', 'mobile', this)">5. student_exam_mid.html</button>
            <button class="menu-btn" onclick="loadPage('student_high.html', '⏰ 高校生用 (タイムマネジメント) UI', 'mobile', this)">6. student_high.html</button>
            <button class="menu-btn" onclick="loadPage('student_exam_high.html', '🎓 大学受験・浪人生用 UI', 'mobile', this)">7. student_exam_high.html</button>
        </div>
        
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #333;">
            <p style="font-size: 11px; color: #555;">※LocalStorageのデータは全iframeで共有されるため、先生画面から宿題を追加し、そのままここで生徒画面に切り替えて連携テストが可能です。</p>
        </div>
    </div>

    <div class="preview-area">
        <div class="preview-header">
            <h2 id="preview-title">👦 小学校低学年用 UI</h2>
            <div class="url-display" id="preview-url">student_low_elem.html</div>
        </div>

        <div class="device-frame" id="device-container">
            <div class="device-notch"></div>
            <iframe id="preview-frame" src="student_low_elem.html"></iframe>
        </div>
    </div>

    <script>
        function loadPage(url, title, deviceType, btnElement) {
            // iframeのURLとタイトルを更新
            document.getElementById('preview-frame').src = url;
            document.getElementById('preview-title').innerText = title;
            document.getElementById('preview-url').innerText = url;

            // デバイスフレームの切り替え (PC or Mobile)
            const deviceFrame = document.getElementById('device-container');
            if(deviceType === 'pc') {
                deviceFrame.classList.add('is-pc');
            } else {
                deviceFrame.classList.remove('is-pc');
            }

            // メニューボタンのアクティブ状態を更新
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
