<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（大学受験）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; background: #1a2530; color: #fff; position: relative; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        .high-header { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; }
        .high-header h1 { font-size: 18px; font-weight: normal; color: #d4af37; margin-bottom: 5px; }
        
        .high-data-box { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .high-data-title { font-size: 12px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        .progress-bar-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 5px; }
        .progress-bar-fill { height: 100%; background: #d4af37; width: 75%; }
        
        .task-list { list-style: none; }
        .task-list li { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .task-checkbox { width: 20px; height: 20px; border: 1px solid #d4af37; border-radius: 4px; display: inline-block; margin-right: 10px; vertical-align: middle; cursor: pointer; }
        
        .btn-ai-analyze { background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 12px; width: 100%; border-radius: 6px; font-size: 14px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="high-header">
            <h1>TODAY'S LOGIC</h1>
            <div style="font-size: 24px; font-weight: bold;">2026.06.02</div>
        </div>
        
        <div class="high-data-box">
            <div class="high-data-title">Target Progress: 共通テストまで</div>
            <div style="font-size: 24px; font-weight: bold; margin-bottom: 5px;">75% <span style="font-size:12px; font-weight:normal; color:#aaa;">達成</span></div>
            <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
        </div>

        <div class="high-data-box">
            <div class="high-data-title">Today's Tasks</div>
            <ul class="task-list">
                <div id="dynamic-high-task"></div>

                <li><div><span class="task-checkbox"></span> 数学 青チャート 例題50</div><span style="color:#aaa;">45 min</span></li>
            </ul>
        </div>

        <div class="high-data-box" style="border-color: #d4af37;">
            <div class="high-data-title" style="color: #d4af37;">AI Weakness Analysis</div>
            <p style="font-size: 13px; color: #ddd;">直近のテスト結果から、数学の「確率」に失点が集中しています。対策プリントを発行しますか？</p>
            <button class="btn-ai-analyze">対策プリントを生成する</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                const targetArea = document.getElementById('dynamic-high-task');
                if(targetArea) {
                    targetArea.innerHTML = `
                        <li style="background: rgba(212, 175, 55, 0.1); border-left: 3px solid #d4af37; padding-left: 10px;">
                            <div><span class="task-checkbox" style="background: #d4af37;"></span> [NEW] ${task.content}</div>
                            <span style="color:#d4af37; font-size:12px;">Deadline: ${task.date}</span>
                        </li>
                    `;
                }
            }
        };
    </script>
</body>
</html>
