<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（中学生）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; background: #f0f4f8; position: relative; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        .mid-countdown { background: #0056b3; color: #fff; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(0,86,179,0.2); }
        .mid-countdown h2 { font-size: 16px; margin: 0 0 5px 0; font-weight: normal; }
        .mid-countdown .days { font-size: 32px; font-weight: bold; }
        
        .mid-card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .mid-card h3 { font-size: 14px; color: #333; margin: 0 0 10px 0; border-bottom: 2px solid #f0f4f8; padding-bottom: 8px; }
        .mid-task { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .mid-task:last-child { border-bottom: none; }
        .mid-badge { background: #ff4757; color: #fff; font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="mid-countdown">
            <h2>🔥 1学期 期末テストまであと</h2>
            <div class="days">14 日</div>
        </div>
        
        <div class="mid-card">
            <h3>⚠️ 提出物チェックリスト（内申点対策）</h3>
            <div class="mid-task">
                <div><input type="checkbox" style="margin-right: 8px;">理科 ワーク P.20〜30</div>
                <span class="mid-badge">明日まで</span>
            </div>
        </div>

        <div class="mid-card">
            <h3>📚 今日の指導宿題</h3>
            <div id="dynamic-mid-task"></div>

            <div class="mid-task">
                <div>数学：連立方程式の応用 3問</div>
                <button style="padding: 5px 15px; background: #28a745; color: #fff; border: none; border-radius: 4px; font-weight: bold;">完了</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                const targetArea = document.getElementById('dynamic-mid-task');
                if(targetArea) {
                    targetArea.innerHTML = `
                        <div class="mid-task" style="background: #e6f7ff; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #90caf9;">
                            <div style="font-weight: bold;">🆕 ${task.content}</div>
                            <span class="mid-badge" style="background: #1976d2;">期日: ${task.date}</span>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
