<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（中学受験）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; min-height: 100vh; background: #fff5f5; position: relative; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.1); padding-bottom: 100px; border-top: 6px solid #d32f2f; }
        
        .exam-header { text-align: center; margin-bottom: 20px; padding: 15px; background: #fff; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .exam-header h1 { font-size: 14px; color: #d32f2f; margin-bottom: 5px; font-weight: bold; }
        .exam-header .target { font-size: 20px; font-weight: bold; color: #333; }
        
        .parent-message { background: #fff; border: 2px solid #ffcdd2; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; color: #c62828; position: relative; }
        .parent-message::before { content: "👪 おうちの方からのメッセージ"; display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #e53935; }
        
        .exam-task-box { background: #fff; border: 1px solid #ffe0e0; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: 0.3s; }
        .exam-task-box.completed { background: #efebe9; border-color: #bcaaa4; opacity: 0.7; }
        .task-row { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: bold; color: #333; }
        .task-row input { transform: scale(1.4); cursor: pointer; }
        
        .btn-mini-done { padding: 6px 12px; background: #d32f2f; color: #fff; border: none; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-mini-done.done { background: #78909c; cursor: default; }

        /* --- 受験ナビAI（フクロウ先生） --- */
        .chat-fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #ff5252; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 4px 15px rgba(211,47,47,0.4); cursor: pointer; z-index: 9999; border: 2px solid #fff; }
        .chat-window { position: fixed; bottom: 100px; right: 20px; width: calc(100% - 40px); max-width: 360px; height: 380px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none; flex-direction: column; overflow: hidden; z-index: 9998; border: 3px solid #ff5252; }
        .chat-header { background: #d32f2f; color: #fff; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #fff9f9; display: flex; flex-direction: column; gap: 10px; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #ffcdd2; background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; outline: none; }
        .chat-input-area button { background: #d32f2f; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; margin-left: 10px; font-weight: bold; cursor: pointer; }
        
        .msg-bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .msg-ai { background: #fff; border: 1px solid #ff8a80; color: #c62828; align-self: flex-start; }
        .msg-student { background: #d32f2f; color: #fff; align-self: flex-end; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="exam-header">
            <h1>🌸 入試本番まで あと 215 日</h1>
            <div class="target">目指せ！第一志望校 合格</div>
        </div>
        
        <div class="parent-message">
            いつも遅くまで頑張っていてえらいね！体調に気をつけて、自分のペースで進めよう。応援しているよ！
        </div>

        <h2 style="font-size: 15px; margin-bottom: 12px; color: #555; padding-left: 5px;">🎯 今日絶対にやる課題</h2>
        
        <div id="dynamic-exam-elem-task"></div>

        <div class="exam-task-box" id="static-task">
            <div class="task-row">
                <span>算数：特殊算（つるかめ算）の復習</span>
                <button class="btn-mini-done" onclick="markDone('static-task', this)">できた！</button>
            </div>
            <div style="font-size: 12px; color: #7f8c8d; margin-top: 8px;">※面積図をノートに丁寧に描いて解いてみよう。</div>
        </div>

        <div class="chat-fab" onclick="toggleChat()">🦉</div>
        <div class="chat-window" id="chat-window">
            <div class="chat-header"><span>🦉 フクロウ先生のヒント部屋</span><span style="cursor: pointer; font-size: 20px;" onclick="toggleChat()">×</span></div>
            <div class="chat-body" id="chat-body">
                <div class="msg-bubble msg-ai">ホッホゥ！解き方が分からなくなったら、何の単元の問題か教えておくれ。一緒にヒントを考えよう。（先生にも内容が伝わるよ）</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="フクロウ先生に聞いてみる...">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                document.getElementById('dynamic-exam-elem-task').innerHTML = `
                    <div class="exam-task-box" id="dynamic-task" style="border-color: #3f51b5; background: #f5f5ff;">
                        <div style="font-size: 11px; color: #3f51b5; font-weight: bold; margin-bottom: 5px;">✨ 先生からの新着ミッション</div>
                        <div class="task-row">
                            <span style="color: #1a237e;">${task.content}</span>
                            <button class="btn-mini-done" style="background: #3f51b5;" onclick="markDynamicDone(this)">できた！</button>
                        </div>
                    </div>`;
            }
        };

        function markDynamicDone(btn) {
            btn.innerText = "合格！💮"; btn.classList.add("done");
            document.getElementById('dynamic-task').classList.add("completed");
            localStorage.setItem('criety_task_status', 'completed');
        }

        function markDone(taskId, btn) {
            btn.innerText = "合格！💮"; btn.classList.add("done");
            document.getElementById(taskId).classList.add("completed");
        }

        function toggleChat() {
            const chat = document.getElementById('chat-window');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            const chatBody = document.getElementById('chat-body');
            
            chatBody.innerHTML += `<div class="msg-bubble msg-student">${text}</div>`;
            input.value = ''; chatBody.scrollTop = chatBody.scrollHeight;

            let chatLog = JSON.parse(localStorage.getItem('criety_chat_log')) || [];
            chatLog.push({ sender: 'student', text: text, time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem('criety_chat_log', JSON.stringify(chatLog));

            setTimeout(() => {
                const aiReply = "ホッホゥ、旅人算の問題じゃな！2人が『出会う』ときは速さの『和』、『追いかける』ときは速さの『差』に注目するのじゃぞ。";
                chatBody.innerHTML += `<div class="msg-bubble msg-ai">${aiReply}</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
                chatLog.push({ sender: 'ai', text: aiReply, time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'}) });
                localStorage.setItem('criety_chat_log', JSON.stringify(chatLog));
            }, 1000);
        }
    </script>
</body>
</html>
