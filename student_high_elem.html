<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criety - 生徒アプリ（高学年・RPG）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #333; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; background: #e8f5e9; position: relative; overflow-y: auto; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .jr-header { background: #2e7d32; color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 0 #1b5e20; }
        .jr-status { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 10px 15px; border-radius: 8px; border: 2px solid #2e7d32; margin-bottom: 20px; font-weight: bold; }
        .jr-exp-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .jr-exp-fill { height: 100%; background: #ffb300; width: 60%; }
        
        .jr-quest-card { background: #fff; border: 2px solid #81c784; border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; }
        .btn-jr-attack { background: #1976d2; color: #fff; border: none; padding: 10px; font-weight: bold; border-radius: 4px; width: 100%; margin-top: 10px; cursor: pointer; box-shadow: 0 3px 0 #0d47a1; }
        .btn-jr-attack:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="jr-header">
            <h1 style="font-size: 20px; margin: 0;">📜 今日のクエストボード</h1>
        </div>
        
        <div class="jr-status">
            <div>勇者レベル: 12</div>
            <div style="width: 50%;">
                <div style="font-size: 10px; text-align: right;">次のレベルまで あと40EXP</div>
                <div class="jr-exp-bar"><div class="jr-exp-fill"></div></div>
            </div>
        </div>

        <div id="dynamic-jr-task"></div>

        <div class="jr-quest-card">
            <div style="font-weight: bold; color: #2e7d32; margin-bottom: 5px;">メインクエスト</div>
            <div style="font-size: 16px; margin-bottom: 10px;">算数ドリル 割合の計算をたおす（P.34）</div>
            <div style="font-size: 12px; color: #e65100; font-weight: bold;">報酬: 20 EXP</div>
            <button class="btn-jr-attack">⚔️ クエストクリア！</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedTask = localStorage.getItem('criety_new_task');
            if(savedTask) {
                const task = JSON.parse(savedTask);
                const targetArea = document.getElementById('dynamic-jr-task');
                if(targetArea) {
                    targetArea.innerHTML = `
                        <div class="jr-quest-card" style="border-color: #ff9800; background: #fffde7;">
                            <div style="font-weight: bold; color: #ff9800; margin-bottom: 5px;">⚠️ 緊急クエスト発生！</div>
                            <div style="font-size: 16px; margin-bottom: 10px;">${task.content}</div>
                            <div style="font-size: 12px; color: #666; font-weight: bold;">期限: ${task.date} / 報酬: 50 EXP</div>
                            <button class="btn-jr-attack" style="background: #ff9800; box-shadow: 0 3px 0 #f57c00;">⚔️ クエストに挑む！</button>
                        </div>
                    `;
                }
            }
        };
    </script>
</body>
</html>
